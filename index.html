<script>
// --- CORE VERİ TABANI ALTYAPISI ---
let db_stok = JSON.parse(localStorage.getItem("db_stok") || '[]');
let db_cari = JSON.parse(localStorage.getItem("db_cari") || '["Dilek Gıda","Grosper Market"]');
let db_evraklar = JSON.parse(localStorage.getItem("db_evraklar") || '[]');

let db_subeler_obj = JSON.parse(localStorage.getItem("db_subeler_obj") || '[]'); 
let db_sube_stoklari = JSON.parse(localStorage.getItem("db_sube_stoklari") || '{}'); 
let db_depo_emirleri_evrak = JSON.parse(localStorage.getItem("db_depo_emirleri_evrak") || '[]');

let db_subeler = db_subeler_obj.map(s => s.ad);
let db_merkez_auth = JSON.parse(localStorage.getItem("db_merkez_auth") || 'null');

// Sistem Değişkenleri
let aktifEvrak = { no: "", cari: "Seçilmedi", kalemler: [], tarih: "", tur: "ALIS" };
let html5QrCode = null;
let seciliCariIslem = "";
let sorguTuru = "ALIS";

let selectedSystemMode = localStorage.getItem("sys_selected_mode") || ""; 
let currentLoginFirma = localStorage.getItem("sys_logged_firma") || "";
let appIsOnline = true; 

// Arama kriteri: "ad" veya "kod"
let currentSearchCriteria = "ad"; 

window.addEventListener('load', () => {
    initSubeStoklari();
    setTimeout(() => {
        document.getElementById('offlineOverlay').classList.add('hidden');
        checkAppRouting();
    }, 1500);
});

function initSubeStoklari() {
    db_subeler_obj.forEach(sube => {
        if(!db_sube_stoklari[sube.ad]) {
            db_sube_stoklari[sube.ad] = {};
        }
    });
    localStorage.setItem("db_sube_stoklari", JSON.stringify(db_sube_stoklari));
}

function toggleInternetSim() {
    appIsOnline = !appIsOnline;
    const btn = document.getElementById('btnNetSim');
    if(appIsOnline) {
        btn.innerText = "İNTERNET DURUMU: AKTİF (ONLINE)";
        btn.style.background = "#27ae60";
    } else {
        btn.innerText = "İNTERNET DURUMU: KESİK (OFFLINE)";
        btn.style.background = "#c0392b";
    }
}

function checkAppRouting() {
    if(currentLoginFirma) {
        openLoginPageStyle();
    } else {
        openPage('updateScreenPage');
    }
}

function selectAppMode(mode) {
    selectedSystemMode = mode;
    document.getElementById('btnSelectMerkez').style.border = mode === 'Merkez' ? '4px solid #fff' : 'none';
    document.getElementById('btnSelectSube').style.border = mode === 'Şube' ? '4px solid #fff' : 'none';
    showToast(mode + " seçildi. Şimdi güncelleyebilirsiniz.");
}

function triggerAppUpdate() {
    if(!selectedSystemMode) return showToast("Lütfen önce Merkez Depo veya Şube modunu seçin!");
    localStorage.setItem("sys_selected_mode", selectedSystemMode);
    openLoginPageStyle();
}

function openLoginPageStyle() {
    document.querySelectorAll('.box').forEach(b => b.classList.add('hidden'));
    document.getElementById('loginPage').classList.remove('hidden');
    
    const isSubeMode = (localStorage.getItem("sys_selected_mode") === "Şube");
    if(isSubeMode) {
        document.getElementById('loginPageTitle').innerText = "ŞUBE GİRİŞ EKRANI";
        document.getElementById('subeLoginArea').classList.remove('hidden');
        document.getElementById('merkezLoginArea').classList.add('hidden');
        document.getElementById('userInp').value = "";
        document.getElementById('passInp').value = "";
        document.getElementById('btnSystemLoginAction').innerText = "ANAHTARLA SİSTEME GİRİŞ";
    } else {
        document.getElementById('loginPageTitle').innerText = "MERKEZ DEPO GİRİŞİ";
        document.getElementById('subeLoginArea').classList.add('hidden');
        if(db_merkez_auth) {
            document.getElementById('merkezLoginArea').classList.add('hidden');
            document.getElementById('btnSystemLoginAction').innerText = "SİSTEME GİRİŞ";
        } else {
            document.getElementById('merkezLoginArea').classList.remove('hidden');
            document.getElementById('btnSystemLoginAction').innerText = "KAYDET VE SİSTEME GİRİŞ";
        }
    }
}

function login() {
    if(!appIsOnline) {
        document.getElementById('offlineOverlay').classList.remove('hidden');
        showToast("Bağlantı yok! Çizgili barkod ekranı aktif edildi.");
        return;
    }
    const isSubeMode = (localStorage.getItem("sys_selected_mode") === "Şube");
    if(isSubeMode) {
        let k1 = document.getElementById('userInp').value.trim();
        let k2 = document.getElementById('passInp').value.trim();
        if(!k1 || !k2) return showToast("Lütfen giriş anahtarlarını eksiksiz yazın!");
        let bulunanSube = db_subeler_obj.find(s => s.key1 == k1 && s.key2 == k2);
        if(!bulunanSube) return showToast("Hatalı Giriş Anahtarları! Erişim reddedildi.");
        currentLoginFirma = bulunanSube.ad;
        localStorage.setItem("sys_logged_firma", currentLoginFirma);
    } else {
        if(!db_merkez_auth) {
            let u = document.getElementById('mUserInp').value.trim();
            let p = document.getElementById('mPassInp').value.trim();
            if(!u || !p) return showToast("Kullanıcı adı ve şifre belirlemelisiniz!");
            db_merkez_auth = { user: u, pass: p };
            localStorage.setItem("db_merkez_auth", JSON.stringify(db_merkez_auth));
        }
        currentLoginFirma = "Merkez Depo";
        localStorage.setItem("sys_logged_firma", currentLoginFirma);
    }
    document.getElementById('navFirma').innerText = currentLoginFirma;
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('navBar').classList.remove('hidden');
    goHome();
}

function logout() { checkAppRouting(); }
