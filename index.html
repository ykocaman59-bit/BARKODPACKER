<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BARKODPACKER ERP - V3.0</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary-blue: #4a90e2;
            --secondary-blue: #5cb8d1;
            --danger-red: #ff5e5e;
            --white: #ffffff;
            --pda-blue: #3b82f6;
            --success-green: #28a745;
            --warning-orange: #f39c12;
        }

        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        input, textarea { -webkit-user-select: text; user-select: text; }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f7f9; overflow-x: hidden; }
        
        #offlineOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--pda-blue); z-index: 20000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .splash-text { color: white; font-size: 28px; font-weight: bold; margin-bottom: 40px; letter-spacing: 2px; }
        .splash-text span { color: #f97316; }

        .navbar { background: var(--primary-blue); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-home-btn { background: rgba(255,255,255,0.2); border: none; border-radius: 10px; padding: 6px 12px; color: white; cursor: pointer; }
        
        .box { padding: 15px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hidden { display: none !important; }

        button { width: 100%; padding: 16px; margin: 8px 0; border: none; border-radius: 15px; background: var(--primary-blue); color: white; font-weight: bold; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:active { transform: scale(0.98); }
        .btn-secondary { background: var(--secondary-blue); }
        .btn-exit { background: var(--danger-red); }
        .btn-success { background: var(--success-green); }
        .btn-warning { background: var(--warning-orange); }
        
        input, select { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; }

        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 6px solid var(--primary-blue); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .info-panel { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-size: 14px; box-shadow: inset 0 0 10px rgba(0,0,0,0.02); }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #f8f9fa; padding: 10px; border: 1px solid #eee; font-size: 12px; }
        td { padding: 10px; border: 1px solid #eee; text-align: center; font-size: 12px; }

        .qty-btn { width: 40px; height: 40px; padding:0; border-radius: 10px; font-size: 20px; }
        .qty-input { width: 60px !important; text-align: center; margin: 0 5px !important; padding: 8px !important; }

        #reader, #readerStok { width: 100%; border-radius: 15px; overflow: hidden; background: #000; margin-bottom: 10px; border: 3px solid var(--primary-blue); }
        #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 50px; padding: 12px; position: fixed; z-index: 10000; left: 50%; bottom: 50px; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 50px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 50px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 30000; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; text-align: center; }
    </style>
</head>
<body>

<div id="offlineOverlay">
    <div class="splash-text">BARKOD<span>PACKER</span></div>
    <div style="color:white">Sistem Yükleniyor...</div>
</div>

<div id="toast">İşlem Başarılı</div>

<!-- GİRİŞ EKRANI -->
<div id="loginPage" class="box" style="text-align: center; margin-top: 60px;">
    <div style="font-size: 40px; margin-bottom: 10px;">📦</div>
    <h2 style="color: var(--primary-blue);">BARKODPACKER ERP</h2>
    <select id="firmaSecimi">
        <option value="Merkez Depo">Merkez Depo</option>
        <option value="Sultanbeyli Şube">Sultanbeyli Şube</option>
        <option value="Sancaktepe Şube">Sancaktepe Şube</option>
    </select>
    <button onclick="login()">SİSTEME GİRİŞ</button>
</div>

<div class="navbar hidden" id="navBar">
    <div><span id="navFirma">Firma</span></div>
    <button class="nav-home-btn" onclick="goHome()">🏠 ANA SAYFA</button>
</div>

<!-- ANA SAYFA -->
<div id="homePage" class="box hidden">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button onclick="openPage('stokPage')">📦 Stok Kartları</button>
        <button class="btn-warning" onclick="openPage('depoSiparisPage')">🚚 DEPO SİPARİŞ</button>
        <button onclick="yeniAlisBaslat()">📥 Alış İrsaliyesi</button>
        <button onclick="yeniSatisBaslat()">📤 Satış İrsaliyesi</button>
        <button class="btn-secondary" onclick="openPage('gecmisSecimPage')">📜 Evrak Geçmişi</button>
        <button id="btnCariMenu" class="btn-secondary" onclick="openPage('cariPage')">👥 Cari Kartlar</button>
    </div>
    <button class="btn-exit" onclick="logout()" style="margin-top:20px">GÜVENLİ ÇIKIŞ</button>
</div>

<!-- DEPO SİPARİŞ ANA SAYFA -->
<div id="depoSiparisPage" class="box hidden">
    <h3>Depo Sipariş İşlemleri</h3>
    <button class="btn-success" onclick="openPage('siparisOlusturPage')">🛒 SİPARİŞ VER</button>
    <button class="btn-secondary" onclick="openPage('gelenlerPage')">📦 DEPODAN GELENLER</button>
    <button class="btn-exit" onclick="goHome()">GERİ</button>
</div>

<!-- SİPARİŞ OLUŞTURMA (KATEGORİ SEÇİMİ) -->
<div id="siparisOlusturPage" class="box hidden">
    <h3>Kategori Seçiniz</h3>
    <button style="background:#27ae60" onclick="siparisListele('MANAV')">🍎 MANAV</button>
    <button style="background:#2980b9" onclick="siparisListele('GIDA')">🧀 GIDA</button>
    <button style="background:#8e44ad" onclick="siparisListele('GIDA DIŞI')">🧼 GIDA DIŞI</button>
    <button class="btn-secondary" onclick="openPage('depoSiparisPage')">GERİ</button>
</div>

<!-- SİPARİŞ LİSTELEME EKRANI -->
<div id="siparisListeEkrani" class="box hidden">
    <h3 id="siparisBaslik">Sipariş</h3>
    <div id="siparisUrunListesi" style="max-height: 400px; overflow-y: auto; margin-bottom: 20px;"></div>
    <button class="btn-success" onclick="siparisOnayla()">SİPARİŞİ ONAYLA</button>
    <button class="btn-secondary" onclick="openPage('siparisOlusturPage')">VAZGEÇ</button>
</div>

<!-- STOK KARTLARI -->
<div id="stokPage" class="box hidden">
    <h3>Stok Kartları</h3>
    <button id="btnYeniStok" onclick="openPage('stokEklePage')" class="btn-success">➕ YENİ ÜRÜN EKLE</button>
    <input id="stokAra" placeholder="Ürün Ara..." oninput="stokListele()">
    <div id="stokListesi"></div>
    <button class="btn-secondary" onclick="goHome()">GERİ</button>
</div>

<!-- STOK EKLEME/DÜZENLEME -->
<div id="stokEklePage" class="box hidden">
    <h3 id="stokFormBaslik">Yeni Ürün Kaydı</h3>
    <input id="newBarkodInp" placeholder="Barkod Okutun veya Yazın">
    <input id="newAdInp" placeholder="Ürün Adı">
    <select id="newKategori">
        <option value="GIDA">GIDA</option>
        <option value="GIDA DIŞI">GIDA DIŞI</option>
        <option value="MANAV">MANAV</option>
    </select>
    <input id="editStokId" type="hidden">
    <button onclick="stokYeniKaydet()" class="btn-success">SİSTEME KAYDET</button>
    <button class="btn-secondary" onclick="openPage('stokPage')">İPTAL</button>
</div>

<!-- CARİ KARTLAR -->
<div id="cariPage" class="box hidden">
    <h3>Cari Kartlar</h3>
    <div id="cariForm">
        <input id="cariInpAd" placeholder="Cari Ünvanı">
        <input id="cariInpId" type="hidden">
        <button onclick="cariEkle()" class="btn-success">KAYDET</button>
    </div>
    <div id="cariListesi"></div>
    <button class="btn-secondary" onclick="goHome()">GERİ</button>
</div>

<!-- İŞLEM SAYFASI (IRSALIYE) -->
<div id="islemPage" class="box hidden">
    <div class="info-panel" id="islemPanel">
        <b id="dispTur">İŞLEM</b><br>
        <b>No:</b> <span id="dispEvrakNo">-</span> | <b>Cari:</b> <span id="dispCari">-</span>
    </div>
    <button onclick="openCariSec()" class="btn-secondary">👤 CARİ SEÇ</button>
    <button onclick="barkodGirisAc()" class="btn-warning">🏷️ ÜRÜN OKUT</button>
    <button onclick="islemSatirlariKontrol()" class="btn-success">📋 SATIRLARI GÖR</button>
    <button class="btn-exit" onclick="goHome()">KAPAT</button>
</div>

<script>
// --- VERİ TABANI ---
let db_stok = JSON.parse(localStorage.getItem("db_stok") || '[]');
let db_cari = JSON.parse(localStorage.getItem("db_cari") || '["Dilek Gıda","Grosper Market"]');
let db_evraklar = JSON.parse(localStorage.getItem("db_evraklar") || '[]');
let db_siparisler = JSON.parse(localStorage.getItem("db_siparisler") || '[]');

let aktifFirma = "";
let aktifEvrak = { no: "", cari: "Seçilmedi", kalemler: [], tarih: "", tur: "ALIS" };
let sepet = {};

window.addEventListener('load', () => {
    setTimeout(() => { document.getElementById('offlineOverlay').style.display = 'none'; }, 1000);
});

function login() {
    aktifFirma = document.getElementById('firmaSecimi').value;
    document.getElementById('navFirma').innerText = aktifFirma;
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('navBar').classList.remove('hidden');
    
    // YETKİ KONTROLÜ
    if(aktifFirma !== "Merkez Depo") {
        document.getElementById('btnYeniStok').classList.add('hidden');
        document.getElementById('cariForm').classList.add('hidden');
    } else {
        document.getElementById('btnYeniStok').classList.remove('hidden');
        document.getElementById('cariForm').classList.remove('hidden');
    }
    goHome();
}

function goHome() { 
    document.querySelectorAll('.box').forEach(b => b.classList.add('hidden'));
    document.getElementById('homePage').classList.remove('hidden');
}

function openPage(id) {
    document.querySelectorAll('.box').forEach(b => b.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    if(id === 'stokPage') stokListele();
    if(id === 'cariPage') cariListele();
}

function showToast(msg) {
    let x = document.getElementById("toast");
    x.innerText = msg; x.className = "show";
    setTimeout(() => x.className = "", 3000);
}

// --- STOK İŞLEMLERİ ---
function stokListele() {
    let ara = document.getElementById('stokAra').value.toLowerCase();
    let h = "";
    // Alfabetik Sıralama
    let liste = [...db_stok].sort((a, b) => a.ad.localeCompare(b.ad));
    
    liste.forEach((s, i) => {
        if(s.ad.toLowerCase().includes(ara) || s.barkod.includes(ara)) {
            h += `<div class="card">
                    <div><b>${s.ad}</b><br><small>${s.barkod} [${s.kategori || 'GIDA'}]</small></div>
                    <div style="text-align:right">
                        <b>${s.stok}</b><br>
                        ${aktifFirma === "Merkez Depo" ? `
                        <button onclick="stokDuzenle(${i})" style="padding:4px; width:auto; background:orange; font-size:10px">Düzenle</button>
                        <button onclick="stokSil(${i})" style="padding:4px; width:auto; background:red; font-size:10px">Sil</button>
                        ` : ''}
                    </div>
                  </div>`;
        }
    });
    document.getElementById('stokListesi').innerHTML = h || "Kayıt bulunamadı.";
}

function stokYeniKaydet() {
    let b = document.getElementById('newBarkodInp').value.trim();
    let a = document.getElementById('newAdInp').value.trim();
    let k = document.getElementById('newKategori').value;
    let id = document.getElementById('editStokId').value;

    if(!b || !a) return showToast("Lütfen tüm alanları doldurun!");

    // MÜKERRER KONTROLÜ
    let varMi = db_stok.find((x, idx) => (x.barkod === b || x.ad === a) && idx != id);
    if(varMi) return alert("HATA: Bu ürün adı veya barkodu zaten sistemde kayıtlı!");

    if(id !== "") {
        db_stok[id] = { ...db_stok[id], barkod: b, ad: a, kategori: k };
    } else {
        db_stok.push({ barkod: b, ad: a, kategori: k, stok: 0 }); // YENİ ÜRÜN 0 ADET
    }

    localStorage.setItem("db_stok", JSON.stringify(db_stok));
    showToast("Ürün Kaydedildi");
    
    // KUTULARI BOŞALT
    document.getElementById('newBarkodInp').value = "";
    document.getElementById('newAdInp').value = "";
    document.getElementById('editStokId').value = "";
    
    openPage('stokPage');
}

// --- SİPARİŞ SİSTEMİ (+/- BUTONLU) ---
function siparisListele(kat) {
    sepet = {}; // Reset
    document.getElementById('siparisBaslik').innerText = kat + " SİPARİŞİ";
    let h = `<table><thead><tr><th>ÜRÜN ADI</th><th>ADET</th></tr></thead><tbody>`;
    
    let urunler = db_stok.filter(s => s.kategori === kat).sort((a,b) => a.ad.localeCompare(b.ad));
    
    urunler.forEach(u => {
        h += `<tr>
                <td style="text-align:left">${u.ad}</td>
                <td>
                    <div style="display:flex; align-items:center; justify-content:center">
                        <button class="qty-btn" style="background:red" onclick="adetDegis('${u.barkod}', -1)">-</button>
                        <input type="number" id="q_${u.barkod}" class="qty-input" value="0" onchange="adetYaz('${u.barkod}', this.value)">
                        <button class="qty-btn" style="background:green" onclick="adetDegis('${u.barkod}', 1)">+</button>
                    </div>
                </td>
              </tr>`;
    });
    
    h += `</tbody></table>`;
    document.getElementById('siparisUrunListesi').innerHTML = h;
    openPage('siparisListeEkrani');
}

function adetDegis(barkod, fark) {
    let inp = document.getElementById('q_' + barkod);
    let yeniVal = parseInt(inp.value) + fark;
    if(yeniVal < 0) yeniVal = 0;
    inp.value = yeniVal;
    sepet[barkod] = yeniVal;
}

function adetYaz(barkod, val) {
    sepet[barkod] = parseInt(val) || 0;
}

function siparisOnayla() {
    let kalemler = [];
    for(let b in sepet) {
        if(sepet[b] > 0) {
            let u = db_stok.find(x => x.barkod === b);
            kalemler.push({ barkod: b, ad: u.ad, miktar: sepet[b] });
        }
    }
    
    if(kalemler.length === 0) return alert("Hiç ürün seçilmedi!");
    
    db_siparisler.push({
        id: Date.now(),
        sube: aktifFirma,
        tarih: new Date().toLocaleString(),
        kalemler: kalemler,
        durum: "BEKLIYOR"
    });
    
    localStorage.setItem("db_siparisler", JSON.stringify(db_siparisler));
    alert("Sipariş Merkeze İletildi!");
    goHome();
}

// --- IRSALIYE VE CARI (STANDART) ---
function logout() { location.reload(); }

function cariListele() {
    let h = "";
    db_cari.forEach((c, i) => {
        h += `<div class="card">
                <b>${c}</b>
                ${aktifFirma === "Merkez Depo" ? `
                <button onclick="cariSil(${i})" style="width:auto; background:red; padding:5px">Sil</button>
                ` : ''}
              </div>`;
    });
    document.getElementById('cariListesi').innerHTML = h;
}

function cariEkle() {
    let ad = document.getElementById('cariInpAd').value.trim();
    if(!ad) return;
    db_cari.push(ad);
    localStorage.setItem("db_cari", JSON.stringify(db_cari));
    document.getElementById('cariInpAd').value = "";
    cariListele();
}

function yeniAlisBaslat() { 
    aktifEvrak = { no: "A-" + Date.now(), cari: "Seçilmedi", kalemler: [], tarih: new Date().toLocaleDateString(), tur: "ALIS" };
    islemPanelGuncelle();
    openPage('islemPage');
}

function yeniSatisBaslat() { 
    aktifEvrak = { no: "S-" + Date.now(), cari: "Seçilmedi", kalemler: [], tarih: new Date().toLocaleDateString(), tur: "SATIS" };
    islemPanelGuncelle();
    openPage('islemPage');
}

function islemPanelGuncelle() {
    document.getElementById('dispTur').innerText = aktifEvrak.tur;
    document.getElementById('dispEvrakNo').innerText = aktifEvrak.no;
    document.getElementById('dispCari').innerText = aktifEvrak.cari;
}

</script>
</body>
</html>
