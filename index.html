<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER ERP</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}

.box{
max-width:520px;
margin:15px auto;
background:#fff;
padding:15px;
border-radius:12px;
}

.hidden{display:none;}

input,select{
width:100%;
padding:10px;
margin:5px 0;
}

button{
width:100%;
padding:10px;
margin:5px 0;
background:#1e66ff;
color:#fff;
border:none;
border-radius:25px;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.top{
display:flex;
justify-content:space-between;
}

.exit{
position:fixed;
bottom:70px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
padding:12px 25px;
border:none;
border-radius:10px;
}

.label{
background:#eee;
padding:10px;
border-radius:10px;
margin:10px 0;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
<h2>BARKODPACKER</h2>

<input id="user" placeholder="Kullanıcı adı">
<input id="pass" type="password" placeholder="Şifre">

<select id="firma">
<option value="">Firma Seçiniz</option>
<option>Demo</option>
<option>Test LTD</option>
</select>

<button onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">
<h3 style="text-align:center;">ANA SAYFA</h3>

<table>
<tr>
<td><button onclick="openPage('stok')">STOK DETAY</button></td>
<td><button onclick="openPage('sayim')">SAYIM</button></td>
</tr>
<tr>
<td><button onclick="openPage('alis')">ALIŞ</button></td>
<td><button onclick="openPage('satis')">SATIŞ</button></td>
</tr>
<tr>
<td><button onclick="openPage('cari')">CARİ</button></td>
<td><button onclick="logout()">ÇIKIŞ</button></td>
</tr>
</table>
</div>

<!-- STOK -->
<div class="box hidden" id="stok">

<div class="top">
<button onclick="home()">🏠</button>
<h3>STOK</h3>
</div>

<input id="stokBarkod" placeholder="Barkod">
<input id="stokUrun" placeholder="Ürün">

<button onclick="kameraStok()">📷 OKU</button>
<div id="reader"></div>

<button onclick="stokEkle()">EKLE</button>

<div id="stokList"></div>
</div>

<!-- CARİ -->
<div class="box hidden" id="cari">

<div class="top">
<button onclick="home()">🏠</button>
<h3>CARİ</h3>
</div>

<input id="cariInput" placeholder="Cari adı">
<button onclick="cariEkle()">EKLE</button>

<input id="cariSearch" placeholder="Ara">
<button onclick="renderCari()">FİLTRELE</button>

<div id="cariList"></div>
</div>

<!-- ALIŞ -->
<div class="box hidden" id="alis">

<div class="top">
<button onclick="home()">🏠</button>
<h3>ALIŞ</h3>
</div>

<div class="label">
<b>Belge:</b> <span id="labelBelge">ALIŞ-YENİ</span><br>
<b>Cari:</b> <span id="labelCari">Seçilmedi</span>
</div>

<button onclick="belgePage()">BELGE NO</button>
<button onclick="cariSecAc()">CARİ SEÇ</button>
<button onclick="barkodAc()">BARKOD GİRİŞ</button>

</div>

<!-- BELGE -->
<div class="box hidden" id="belgePage">
<h3>Belge No</h3>
<input id="belge1">
<button onclick="belgeKaydet()">KAYDET</button>
</div>

<!-- CARİ SEÇ -->
<div class="box hidden" id="cariSec">
<input id="cariSearch2">
<button onclick="renderCariSec()">ARA</button>
<div id="cariSecList"></div>
</div>

<!-- BARKOD -->
<div class="box hidden" id="barkodPage">

<div class="top">
<button onclick="home()">🏠</button>
<button onclick="stopCam()">❌ KAPAT</button>
</div>

<input id="barkodInput">
<button onclick="urunGetir()">GETİR</button>
<button onclick="kamera()">📷 OKU</button>

<div id="urunInfo"></div>

<input id="adet" type="number" placeholder="Adet">
<button onclick="ekle()">EKLE</button>

</div>

<script>

/* DATA */
let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let cari=JSON.parse(localStorage.getItem("cari")||"[]");
let alis=JSON.parse(localStorage.getItem("alis")||"[]");

let cam=null;
let aktif=null;
let cariSecili="";
let belgeNo="";

/* LOGIN */
function login(){
if(!firma.value){
alert("Firma seçiniz");
return;
}
if(user.value==="admin" && pass.value==="1234"){
loginPage.classList.add("hidden");
homePage.classList.remove("hidden");
}
}

function logout(){location.reload();}

/* NAV */
function openPage(id){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

/* STOK */
function kameraStok(){

cam=new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(dev=>{
let back=dev.find(d=>d.label.toLowerCase().includes("back"))||dev[0];

cam.start(back.id,{fps:10,qrbox:250},txt=>{
stokBarkod.value=txt;
stopCam();
});
});
}

function stokEkle(){

if(!stokBarkod.value || !stokUrun.value) return;

if(stok.find(x=>x.barkod===stokBarkod.value)){
alert("Zaten var");
return;
}

stok.push({
barkod:stokBarkod.value,
urun:stokUrun.value,
adet:0
});

localStorage.setItem("stok",JSON.stringify(stok));

stokBarkod.value="";
stokUrun.value="";

renderStok();
}

function renderStok(){

let html="<table><tr><th>Barkod</th><th>Ürün</th><th>Adet</th><th></th></tr>";

stok.forEach((s,i)=>{
html+=`
<tr>
<td>${s.barkod}</td>
<td>${s.urun}</td>
<td>${s.adet}</td>
<td>
<button onclick="stokDuzenle(${i})">DÜZ</button>
<button onclick="stokSil(${i})">SİL</button>
</td>
</tr>`;
});

html+="</table>";
stokList.innerHTML=html;
}

function stokSil(i){
if(confirm("Silinsin mi?")){
stok.splice(i,1);
localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}
}

function stokDuzenle(i){
let b=prompt("Barkod",stok[i].barkod);
let u=prompt("Ürün",stok[i].urun);

if(b&&u){
stok[i].barkod=b;
stok[i].urun=u;
localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}
}

/* CARİ */
function cariEkle(){

if(!cariInput.value) return;

if(cari.includes(cariInput.value)){
alert("Var");
return;
}

cari.push(cariInput.value);
localStorage.setItem("cari",JSON.stringify(cari));

cariInput.value="";
renderCari();
}

function renderCari(){

let f=cariSearch.value.toLowerCase();

let list=cari.filter(x=>x.toLowerCase().includes(f)).sort();

let html="<table>";

list.forEach(c=>{
html+=`<tr><td onclick="secCari('${c}')">${c}</td></tr>`;
});

html+="</table>";
cariList.innerHTML=html;
}

function secCari(c){
cariSecili=c;
labelCari.innerText=c;
openPage("alis");
}

/* BELGE */
function belgePage(){
belge1.value="ALIŞ-"+Date.now();
openPage("belgePage");
}

function belgeKaydet(){
belgeNo=belge1.value;
labelBelge.innerText=belgeNo;
openPage("alis");
}

/* BARKOD */
function barkodAc(){

if(!cariSecili){
alert("Cari seçiniz");
return;
}

openPage("barkodPage");
}

/* ÜRÜN */
function urunGetir(){

let u=stok.find(x=>x.barkod==barkodInput.value);

if(!u){
alert("Bulunamadı");
return;
}

aktif=u;
urunInfo.innerHTML=u.urun+" / "+u.adet;
}

/* EKLE */
function ekle(){

if(!aktif||!adet.value) return;

aktif.adet+=Number(adet.value);

alis.push({
belge:belgeNo,
barkod:aktif.barkod,
adet:Number(adet.value)
});

localStorage.setItem("stok",JSON.stringify(stok));
localStorage.setItem("alis",JSON.stringify(alis));

adet.value="";
barkodInput.value="";
urunInfo.innerHTML="";
}

/* CAMERA */
function kamera(){

cam=new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(dev=>{
let back=dev.find(d=>d.label.toLowerCase().includes("back"))||dev[0];

cam.start(back.id,{fps:10,qrbox:250},txt=>{
barkodInput.value=txt;
stopCam();
});
});
}

function stopCam(){
if(cam){
cam.stop().then(()=>cam.clear());
cam=null;
}
}

</script>

</body>
</html>
