<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.box{max-width:520px;margin:20px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}
input,button,select{width:100%;padding:10px;margin:5px 0;}
.top{display:flex;justify-content:space-between;}
table{width:100%;border-collapse:collapse;}
td,th{border:1px solid #ddd;padding:8px;text-align:center;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
<h2>BARKODPACKER</h2>
<input id="user" placeholder="admin">
<input id="pass" type="password" placeholder="1234">
<select id="firma">
<option>Firma Seçiniz</option>
<option>Demo</option>
</select>
<button onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">
<h3>ANA SAYFA</h3>
<button onclick="openPage('alis')">ALIŞ İRSALİYE</button>
<button onclick="openPage('stok')">STOK</button>
</div>

<!-- STOK -->
<div class="box hidden" id="stok">
<button onclick="home()">🏠</button>

<input id="stokBarkod" placeholder="Barkod">
<input id="stokUrun" placeholder="Ürün">
<button onclick="stokEkle()">EKLE</button>

<div id="stokList"></div>
</div>

<!-- ALIŞ -->
<div class="box hidden" id="alis">

<button onclick="home()">🏠</button>

<h3>ALIŞ İRSALİYE</h3>

<label>Belge No</label>
<input value="PDA" disabled>
<input id="belgeNo">

<label>Cari</label>
<select id="cariSelect"></select>

<button onclick="barkodAc()">BARKOD GİRİŞ</button>

</div>

<!-- BARKOD -->
<div class="box hidden" id="barkodPage">

<div class="top">
<button onclick="geri()">⬅</button>
<button onclick="toggleListe()">📒 / 📷</button>
</div>

<h3>BARKOD</h3>

<input id="barkodInput">
<button onclick="urunGetir()">GETİR</button>
<button onclick="kamera()">📷 OKU</button>

<div id="reader"></div>

<div id="urunInfo"></div>

<input id="adet" type="number" placeholder="Adet">
<button onclick="ekle()">EKLE</button>

<div id="liste"></div>

</div>

<script>

let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let alis=JSON.parse(localStorage.getItem("alis")||"[]");
let scanner=null;
let aktifUrun=null;
let listeAcik=false;

/* LOGIN */
function login(){
if(user.value==="admin" && pass.value==="1234"){
loginPage.classList.add("hidden");
homePage.classList.remove("hidden");
}
}

/* NAV */
function openPage(id){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");

if(id==="stok") renderStok();
if(id==="alis") initAlis();
}

function home(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
homePage.classList.remove("hidden");
}

/* STOK */
function stokEkle(){
stok.push({barkod:stokBarkod.value,urun:stokUrun.value,adet:0});
localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}

function renderStok(){
let html="<table><tr><th>Barkod</th><th>Ürün</th><th>Adet</th></tr>";
stok.forEach(s=>{
html+=`<tr><td>${s.barkod}</td><td>${s.urun}</td><td>${s.adet}</td></tr>`;
});
html+="</table>";
stokList.innerHTML=html;
}

/* ALIŞ */
function initAlis(){
belgeNo.value="ALIS-"+Date.now();
cariSelect.innerHTML="<option>Demo</option>";
}

/* BARKOD GİRİŞ */
function barkodAc(){
if(!cariSelect.value){
alert("Cari seç");
return;
}

document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
barkodPage.classList.remove("hidden");
}

/* ÜRÜN GETİR */
function urunGetir(){
let urun=stok.find(x=>x.barkod==barkodInput.value);

if(!urun){
alert("Ürün yok");
return;
}

aktifUrun=urun;

urunInfo.innerHTML=`
Ürün: ${urun.urun} <br>
Stok: ${urun.adet}
`;
}

/* EKLE */
function ekle(){
if(!aktifUrun) return;

let a=Number(adet.value);

aktifUrun.adet+=a;

alis.push({
belge:belgeNo.value,
urun:aktifUrun.urun,
adet:a
});

localStorage.setItem("stok",JSON.stringify(stok));
localStorage.setItem("alis",JSON.stringify(alis));

urunInfo.innerHTML="Eklendi!";
}

/* LİSTE */
function toggleListe(){
listeAcik=!listeAcik;

if(listeAcik){
renderListe();
}else{
liste.innerHTML="";
}
}

function renderListe(){
let l=alis.filter(x=>x.belge==belgeNo.value);

let html="<table><tr><th>#</th><th>Ürün</th><th>Adet</th></tr>";

l.forEach((x,i)=>{
html+=`<tr><td>${i+1}</td><td>${x.urun}</td><td>${x.adet}</td></tr>`;
});

html+="</table>";

liste.innerHTML=html;
}

/* KAMERA */
function kamera(){
scanner=new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(dev=>{
let cam=dev.find(d=>d.label.toLowerCase().includes("back"))||dev[0];

scanner.start(cam.id,{fps:10,qrbox:250},(text)=>{
barkodInput.value=text;
scanner.stop();
});
});
}

/* GERİ */
function geri(){
openPage("alis");
}

</script>

</body>
</html>
