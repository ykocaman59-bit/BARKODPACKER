<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER ERP</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}

.box{max-width:520px;margin:15px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}

input,button,select{
width:100%;
padding:10px;
margin:5px 0;
}

button{
background:#1976ff;
color:white;
font-weight:bold;
border:none;
border-radius:6px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.top{display:flex;justify-content:space-between;}

.exit{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
font-weight:bold;
padding:12px 25px;
border:none;
border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
<h2>BARKODPACKER</h2>
<input id="user" placeholder="Kullanıcı adı">
<input id="pass" type="password" placeholder="Şifre">

<select id="firma">
<option>Firma Seçiniz</option>
<option>Demo</option>
<option>Test LTD</option>
</select>

<button onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">
<h3 style="text-align:center;">ANA SAYFA</h3>

<table>
<tr>
<td><button onclick="openPage('stok')">STOK</button></td>
<td><button onclick="openPage('alis')">ALIŞ</button></td>
</tr>
<tr>
<td><button onclick="openPage('cari')">CARİ</button></td>
<td><button onclick="openInvoiceList()">EVRAKLAR</button></td>
</tr>
</table>

<button class="exit" onclick="logout()">ÇIKIŞ</button>
</div>

<!-- STOK -->
<div class="box hidden" id="stok">
<div class="top">
<button onclick="home()">🏠</button>
<h3>STOK</h3>
</div>

<input id="stokBarkod" placeholder="Barkod">
<input id="stokUrun" placeholder="Ürün">

<button onclick="stokEkle()">EKLE</button>

<div id="stokList"></div>
</div>

<!-- CARİ -->
<div class="box hidden" id="cari">
<div class="top">
<button onclick="home()">🏠</button>
<h3>CARİ</h3>
</div>

<input id="cariInput" placeholder="Cari adı">
<button onclick="cariEkle()">EKLE</button>

<input id="cariSearch" placeholder="Filtre">
<button onclick="renderCari()">FİLTRELE / LİSTELE</button>

<div id="cariList"></div>
</div>

<!-- ALIŞ -->
<div class="box hidden" id="alis">
<div class="top">
<button onclick="home()">🏠</button>
<h3>ALIŞ</h3>
</div>

<div>
<b>Belge:</b> <span id="labelBelge">-</span><br>
<b>Cari:</b> <span id="labelCari">Seçilmedi</span>
</div>

<button onclick="belgePage()">BELGE NO</button>
<button onclick="cariSecAc()">CARİ SEÇ</button>
<button onclick="barkodAc()">BARKOD GİR</button>
</div>

<!-- BELGE -->
<div class="box hidden" id="belgePage">
<button onclick="geriAlis()">⬅</button>

<h3>Belge No</h3>
<input id="belge1" placeholder="ALIŞ- otomatik / düzenlenebilir">
<input id="belge2" placeholder="Alternatif">

<button onclick="belgeKaydet()">KAYDET</button>
</div>

<!-- CARİ SEÇ -->
<div class="box hidden" id="cariSec">
<button onclick="geriAlis()">⬅</button>

<input id="cariSearch2" oninput="cariFiltre2()">
<div id="cariSecList"></div>
</div>

<!-- BARKOD -->
<div class="box hidden" id="barkodPage">
<div class="top">
<button onclick="geriAlis()">⬅</button>
</div>

<input id="barkodInput">
<button onclick="urunGetir()">GETİR</button>

<div id="urunInfo"></div>

<input id="adet" type="number" placeholder="Adet">
<button onclick="ekle()">EKLE</button>
</div>

<!-- EVRAK LİSTE -->
<div class="box hidden" id="invoiceListPage">
<button onclick="home()">⬅ HOME</button>

<h3>Evraklar</h3>

<input id="t1" type="date">
<input id="t2" type="date">
<button onclick="listeleEvrak()">GETİR</button>

<div id="invoiceList"></div>
</div>

<script>

/* DATA */
let stok = JSON.parse(localStorage.getItem("stok")||"[]");
let cari = JSON.parse(localStorage.getItem("cari")||"[]");
let alis = JSON.parse(localStorage.getItem("alis")||"[]");

let aktif=null;
let belgeNo="";
let cariSecili="";

/* LOGIN */
function login(){
if(user.value==="admin" && pass.value==="1234"){
loginPage.classList.add("hidden");
homePage.classList.remove("hidden");
}
}

function logout(){location.reload();}

/* NAV */
function openPage(id){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
if(id==="stok") renderStok();
if(id==="cari") renderCari();
}

function home(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
homePage.classList.remove("hidden");
}

/* STOK */
function stokEkle(){
if(!stokBarkod.value || !stokUrun.value) return;

stok.push({barkod:stokBarkod.value,urun:stokUrun.value,adet:0});
localStorage.setItem("stok",JSON.stringify(stok));

stokBarkod.value="";
stokUrun.value="";
renderStok();
}

function renderStok(){
let html="<table><tr><th>Barkod</th><th>Ürün</th><th>Adet</th><th></th></tr>";
stok.forEach((s,i)=>{
html+=`<tr>
<td>${s.barkod}</td>
<td>${s.urun}</td>
<td>${s.adet}</td>
<td>
<button onclick="stokSil(${i})">Sil</button>
<button onclick="stokDuzenle(${i})">Düz</button>
</td>
</tr>`;
});
html+="</table>";
stokList.innerHTML=html;
}

function stokSil(i){
if(confirm("Emin misiniz?")){
stok.splice(i,1);
localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}
}

function stokDuzenle(i){
let b=prompt("Barkod",stok[i].barkod);
let u=prompt("Ürün",stok[i].urun);
if(b&&u){
stok[i]={barkod:b,urun:u,adet:stok[i].adet};
localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}
}

/* CARİ */
function cariEkle(){
if(!cariInput.value) return;
cari.push(cariInput.value);
cari.sort();
localStorage.setItem("cari",JSON.stringify(cari));
cariInput.value="";
renderCari();
}

function renderCari(){
let v=cariSearch.value?.toLowerCase()||"";
let list=cari.filter(x=>x.toLowerCase().includes(v));

let html="<table>";
list.forEach((c,i)=>{
html+=`<tr>
<td>${c}</td>
<td>
<button onclick="cariSil(${i})">Sil</button>
</td>
</tr>`;
});
html+="</table>";
cariList.innerHTML=html;
}

function cariSil(i){
if(confirm("Emin misiniz?")){
cari.splice(i,1);
localStorage.setItem("cari",JSON.stringify(cari));
renderCari();
}
}

/* BELGE */
function belgePage(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById("belgePage").classList.remove("hidden");

if(!belgeNo){
belgeNo="ALIŞ-"+Date.now();
}
belge1.value=belgeNo;
}

function belgeKaydet(){
belgeNo=belge1.value;
labelBelge.innerText=belgeNo;
geriAlis();
}

/* CARİ SEÇ */
function cariSecAc(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
cariSec.classList.remove("hidden");
cariFiltre2();
}

function cariFiltre2(){
let v=cariSearch2.value.toLowerCase();
let list=cari.filter(x=>x.toLowerCase().includes(v));

let html="<table>";
list.forEach(c=>{
html+=`<tr><td onclick="secCari('${c}')">${c}</td></tr>`;
});
html+="</table>";
cariSecList.innerHTML=html;
}

function secCari(c){
cariSecili=c;
labelCari.innerText=c;
geriAlis();
}

function geriAlis(){
openPage("alis");
}

/* BARKOD */
function barkodAc(){
if(!cariSecili){
alert("Cari seçiniz");
return;
}
openPage("barkodPage");
}

function urunGetir(){
aktif=stok.find(x=>x.barkod==barkodInput.value);
if(!aktif){alert("Yok");return;}
urunInfo.innerHTML=aktif.urun+" / "+aktif.adet;
}

/* EKLE + EVRAK KAYIT */
function ekle(){
if(!aktif||!adet.value) return;

aktif.adet+=Number(adet.value);

let evrak=alis.find(a=>a.belge===belgeNo);
if(!evrak){
evrak={id:Date.now(),belge:belgeNo,cari:cariSecili,tarih:new Date().toISOString(),items:[]};
alis.push(evrak);
}

evrak.items.push({barkod:aktif.barkod,adet:Number(adet.value)});
localStorage.setItem("stok",JSON.stringify(stok));
localStorage.setItem("alis",JSON.stringify(alis));

adet.value="";
barkodInput.value="";
urunInfo.innerHTML="";
}

/* EVRAK LİSTE */
function openInvoiceList(){
openPage("invoiceListPage");
}

function listeleEvrak(){
let t1=t1.value;
let t2=t2.value;

let html="<table>";
alis.forEach(a=>{
html+=`<tr><td onclick="openEvrak(${a.id})">${a.belge}</td></tr>`;
});
html+="</table>";
invoiceList.innerHTML=html;
}

function openEvrak(id){
let ev=alis.find(x=>x.id===id);
alert(ev.belge);
}

</script>

</body>
</html>
