<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER ERP</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f1f5f9;
}

.hidden{display:none;}

.navbar{
    background:#2563eb;
    color:white;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
}

.box{padding:15px;}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    margin-top:8px;
    font-size:16px;
    font-weight:bold;
    color:white;
    background:#2563eb;
}

.btn-red{background:#ef4444;}
.btn-green{background:#22c55e;}
.btn-orange{background:#f59e0b;}
.btn-gray{background:#64748b;}

input,select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
    margin-top:8px;
    box-sizing:border-box;
}

.card{
    background:white;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.smallBtn{
    width:auto;
    padding:8px 10px;
    border-radius:8px;
    margin-left:5px;
}

table{
    width:100%;
    background:white;
    border-radius:10px;
    margin-top:10px;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

</style>
</head>

<body>

<div class="navbar hidden" id="navbar">
    <span>BARKODPACKER ERP</span>
</div>

<div id="loginPage" class="box">
    <h2>Giriş</h2>
    <input id="userInp">
    <input id="passInp" type="password">
    <select id="firmaInp">
        <option value="">Firma</option>
        <option>Demo</option>
    </select>
    <button onclick="login()">GİRİŞ</button>
</div>

<div id="homePage" class="box hidden">
    <button onclick="openPage('evrakListesiPage')">EVRAK GETİR</button>
</div>

<div id="evrakListesiPage" class="box hidden">

    <h3>EVRAK SORGULAMA</h3>

    <label>İlk Tarih</label>
    <input type="date" id="filterBasTar">

    <label>Son Tarih</label>
    <input type="date" id="filterBitTar">

    <button onclick="evrakSorgula()" style="background:#22c55e;">EVRAKLARI GETİR</button>

    <table>
        <thead>
            <tr>
                <th>Tarih</th>
                <th>No</th>
                <th>Cari</th>
            </tr>
        </thead>
        <tbody id="evrakSorguGövde"></tbody>
    </table>

</div>

<script>

let db_evraklar = JSON.parse(localStorage.getItem("db_evraklar") || "[]");

function login(){
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("navbar").classList.remove("hidden");
    openPage("homePage");
}

function openPage(id){
    document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
    stopCamera?.();
}

/* =======================
   🔥 DÜZELTİLEN KISIM 1
======================= */
function openEvrakGetir() {

    let bugunStr = new Date().toISOString().split('T')[0];

    document.getElementById('filterBasTar').value = bugunStr;
    document.getElementById('filterBitTar').value = bugunStr;

    document.getElementById('evrakSorguGövde').innerHTML = "";

    openPage('evrakListesiPage');
}

/* =======================
   🔥 DÜZELTİLEN KISIM 2
======================= */
function evrakSorgula() {

    let bas = document.getElementById('filterBasTar').value;
    let bit = document.getElementById('filterBitTar').value;

    let basT = new Date(bas);
    let bitT = new Date(bit);

    let html = "";

    let filtre = db_evraklar.filter(e => {
        let t = new Date(e.tarih);
        return t >= basT && t <= bitT;
    });

    if (filtre.length > 0) {
        filtre.forEach(e => {
            html += `
            <tr>
                <td>${e.tarih}</td>
                <td>${e.no}</td>
                <td>${e.cari}</td>
            </tr>`;
        });
    } else {
        html = `
        <tr>
            <td colspan="3" style="color:red; padding:15px;">
                Evrak bulunamadı
            </td>
        </tr>`;
    }

    document.getElementById('evrakSorguGövde').innerHTML = html;
}

function stopCamera(){}

</script>

</body>
</html>
