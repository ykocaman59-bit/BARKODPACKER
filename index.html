<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.container{max-width:500px;margin:20px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}
button,input,select{width:100%;padding:10px;margin:5px 0;}
.primary{background:#2d74da;color:#fff;border:0;}
.danger{background:red;color:#fff;border:0;}
ul{list-style:none;padding:0;}
li{padding:8px;border-bottom:1px solid #ddd;}
.topbar{display:flex;justify-content:space-between;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginPage">
  <h2>BARKODPACKER</h2>

  <input id="user" placeholder="Kullanıcı">
  <input id="pass" type="password" placeholder="Şifre">

  <select id="firma">
    <option>Firma Seçiniz</option>
    <option>Demo A.Ş</option>
  </select>

  <button class="primary" onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="container hidden" id="homePage">
  <h3>ANA SAYFA</h3>

  <button onclick="openPage('stokPage')">STOK DETAY</button>
  <button onclick="openPage('cariPage')">CARİ</button>
</div>

<!-- STOK -->
<div class="container hidden" id="stokPage">
  <div class="topbar">
    <button onclick="home()">🏠</button>
    <h3>STOK</h3>
  </div>

  <input id="barkod" placeholder="Barkod">
  <input id="urun" placeholder="Ürün adı">

  <button class="primary" onclick="stokEkle()">EKLE</button>
  <button onclick="kameraAc()">📷 OKU</button>

  <div id="reader"></div>

  <ul id="stokList"></ul>
</div>

<!-- CARİ -->
<div class="container hidden" id="cariPage">
  <div class="topbar">
    <button onclick="home()">🏠</button>
    <h3>CARİ</h3>
  </div>

  <input id="cariInput" placeholder="Cari adı">
  <button class="primary" onclick="cariEkle()">EKLE</button>

  <ul id="cariList"></ul>
</div>

<script>

let stok = JSON.parse(localStorage.getItem("stok")||"[]");
let cari = JSON.parse(localStorage.getItem("cari")||"[]");
let scanner = null;

/* SAVE */
function save(){
  localStorage.setItem("stok",JSON.stringify(stok));
  localStorage.setItem("cari",JSON.stringify(cari));
}

/* LOGIN */
function login(){
  const u=user.value,p=pass.value,f=firma.value;

  if(u==="admin" && p==="1234" && f!=="Firma Seçiniz"){
    loginPage.classList.add("hidden");
    homePage.classList.remove("hidden");
  } else alert("Hatalı giriş");
}

/* NAV */
function openPage(id){
  stopCamera();
  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  if(id==="stokPage") renderStok();
  if(id==="cariPage") renderCari();
}

function home(){
  stopCamera();
  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));
  homePage.classList.remove("hidden");
}

/* STOK */
function stokEkle(){
  if(!barkod.value||!urun.value) return;

  stok.push({barkod:barkod.value,urun:urun.value,adet:0});
  save();
  renderStok();
}

function sil(i){
  if(confirm("Silinsin mi?")){
    stok.splice(i,1);
    save();
    renderStok();
  }
}

function duzenle(i){
  let b=prompt("Barkod",stok[i].barkod);
  let u=prompt("Ürün",stok[i].urun);

  if(b&&u){
    stok[i].barkod=b;
    stok[i].urun=u;
    save();
    renderStok();
  }
}

function renderStok(){
  stokList.innerHTML="";
  stok.forEach((s,i)=>{
    stokList.innerHTML+=`
      <li>
        ${s.barkod} / ${s.urun} / ${s.adet}
        <button onclick="duzenle(${i})">Düzenle</button>
        <button class="danger" onclick="sil(${i})">Sil</button>
      </li>`;
  });
}

/* CARİ */
function cariEkle(){
  if(!cariInput.value) return;

  cari.push(cariInput.value);
  cari.sort();
  save();
  renderCari();
}

function cariSil(i){
  if(confirm("Silinsin mi?")){
    cari.splice(i,1);
    save();
    renderCari();
  }
}

function cariDuzenle(i){
  let c=prompt("Cari",cari[i]);
  if(c){
    cari[i]=c;
    save();
    renderCari();
  }
}

function renderCari(){
  cariList.innerHTML="";
  cari.forEach((c,i)=>{
    cariList.innerHTML+=`
      <li>
        ${c}
        <button onclick="cariDuzenle(${i})">Düzenle</button>
        <button class="danger" onclick="cariSil(${i})">Sil</button>
      </li>`;
  });
}

/* CAMERA FIX (BACK CAMERA) */
function kameraAc(){
  stopCamera();

  scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices=>{
    let cam = devices.find(d=>d.label.toLowerCase().includes("back")) || devices[0];

    scanner.start(
      cam.id,
      {fps:10,qrbox:250},
      (text)=>{
        barkod.value = text;
        stopCamera();
      }
    );
  });
}

/* STOP */
function stopCamera(){
  if(scanner){
    scanner.stop().then(()=>scanner.clear()).catch(()=>{});
    scanner=null;
  }
}

</script>

</body>
</html>
