<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BARKODPACKER ERP</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.box{max-width:520px;margin:20px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}

input,button,select{
width:100%;
padding:10px;
margin:5px 0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.top{display:flex;justify-content:space-between;}

.bottomExit{
position:fixed;
bottom:80px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
padding:12px 25px;
border-radius:10px;
border:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
<h2>BARKODPACKER</h2>

<input id="user" placeholder="admin">
<input id="pass" type="password" placeholder="1234">

<select id="firma">
<option>Firma Seçiniz</option>
<option>Demo</option>
</select>

<button onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">

<h3 style="text-align:center;">ANA SAYFA</h3>

<table>
<tr>
<td><button onclick="openPage('stok')">STOK</button></td>
<td><button onclick="openPage('sayim')">SAYIM</button></td>
</tr>
<tr>
<td><button onclick="openPage('alis')">ALIŞ</button></td>
<td><button onclick="openPage('satis')">SATIŞ</button></td>
</tr>
<tr>
<td colspan="2"><button onclick="openPage('cari')">CARİ</button></td>
</tr>
</table>

<button class="bottomExit" onclick="logout()">ÇIKIŞ</button>

</div>

<!-- STOK -->
<div class="box hidden" id="stok">
<div class="top">
<button onclick="home()">🏠</button>
<h3>STOK</h3>
</div>

<input id="stokBarkod" placeholder="Barkod">
<input id="stokUrun" placeholder="Ürün">

<button onclick="stokEkle()">EKLE</button>
<button onclick="kamera()">📷 OKU</button>

<div id="reader"></div>
<div id="stokList"></div>
</div>

<!-- CARİ -->
<div class="box hidden" id="cari">
<div class="top">
<button onclick="home()">🏠</button>
<h3>CARİ</h3>
</div>

<input id="cariInput" placeholder="Cari adı">
<button onclick="cariEkle()">EKLE</button>

<input id="cariSearch" placeholder="Ara">
<button onclick="cariFiltre()">Filtrele</button>

<div id="cariList"></div>
</div>

<!-- CARİ SEÇ -->
<div class="box hidden" id="cariSec">
<button onclick="geriAlis()">⬅</button>

<h3>Cari Seç</h3>

<input id="cariSearch2">
<button onclick="cariFiltre2()">Filtrele</button>

<div id="cariSecList"></div>
</div>

<!-- SAYIM -->
<div class="box hidden" id="sayim">
<button onclick="home()">🏠</button>
<h3>SAYIM FİŞİ</h3>
</div>

<!-- SATIŞ -->
<div class="box hidden" id="satis">
<button onclick="home()">🏠</button>
<h3>SATIŞ</h3>
</div>

<!-- ALIŞ -->
<div class="box hidden" id="alis">

<div class="top">
<button onclick="home()">🏠</button>
<h3>ALIŞ</h3>
</div>

<input value="PDA" disabled>
<input id="belgeNo">

<select id="cariSelect"></select>

<button onclick="cariSecAc()">CARİ SEÇ</button>
<button onclick="barkodAc()">BARKOD GİRİŞ</button>

</div>

<!-- BARKOD -->
<div class="box hidden" id="barkodPage">

<div class="top">
<button onclick="geri()">⬅</button>
<button onclick="toggleListe()">📒 / 📷</button>
</div>

<input id="barkodInput">
<button onclick="urunGetir()">GETİR</button>

<button onclick="kamera()">📷 OKU</button>

<div id="reader"></div>

<div id="urunInfo"></div>

<input id="adet" type="number" placeholder="Adet">
<button onclick="ekle()">EKLE</button>

<div id="liste"></div>

</div>

<script>

let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let cari=JSON.parse(localStorage.getItem("cari")||"[]");
let alis=JSON.parse(localStorage.getItem("alis")||"[]");

let aktifUrun=null;
let listeAcik=false;
let scanner=null;

/* LOGIN */
function login(){
if(user.value==="admin" && pass.value==="1234" && firma.value!=="Firma Seçiniz"){
loginPage.classList.add("hidden");
homePage.classList.remove("hidden");
}
}

function logout(){location.reload();}

/* NAV */
function openPage(id){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");

if(id==="stok") renderStok();
if(id==="cari") renderCari();
if(id==="alis") initAlis();
}

function home(){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
homePage.classList.remove("hidden");
}

/* STOK */
function stokEkle(){
if(!stokBarkod.value || !stokUrun.value) return;

if(stok.find(x=>x.barkod==stokBarkod.value)){
alert("Bu barkod var"); return;
}

stok.push({barkod:stokBarkod.value,urun:stokUrun.value,adet:0});
localStorage.setItem("stok",JSON.stringify(stok));

stokBarkod.value="";
stokUrun.value="";

renderStok();
}

function renderStok(){
let html="<table><tr><th>Barkod</th><th>Ürün</th><th>Adet</th><th>İşlem</th></tr>";

stok.forEach((s,i)=>{
html+=`<tr>
<td>${s.barkod}</td>
<td>${s.urun}</td>
<td>${s.adet}</td>
<td>
<button onclick="stokDuzenle(${i})">Düzenle</button>
<button onclick="stokSil(${i})">Sil</button>
</td>
</tr>`;
});

html+="</table>";
stokList.innerHTML=html;
}

function stokSil(i){
if(confirm("Silmek istediğinize emin misiniz?")){
stok.splice(i,1);
localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}
}

function stokDuzenle(i){
let b=prompt("Barkod",stok[i].barkod);
let u=prompt("Ürün",stok[i].urun);

if(!b||!u) return;

if(stok.find((x,idx)=>x.barkod==b && idx!=i)){
alert("Bu barkod var");return;
}

stok[i].barkod=b;
stok[i].urun=u;

localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}

/* CARİ */
function cariEkle(){
if(!cariInput.value) return;

if(cari.find(x=>x.toLowerCase()==cariInput.value.toLowerCase())){
alert("Zaten var"); return;
}

cari.push(cariInput.value);
cari.sort();

localStorage.setItem("cari",JSON.stringify(cari));

cariInput.value="";
renderCari();
}

function renderCari(){
let html="<table><tr><th>Cari</th><th>İşlem</th></tr>";

cari.forEach((c,i)=>{
html+=`<tr>
<td>${c}</td>
<td>
<button onclick="cariDuzenle(${i})">Düzenle</button>
<button onclick="cariSil(${i})">Sil</button>
</td>
</tr>`;
});

html+="</table>";
cariList.innerHTML=html;
}

function cariFiltre(){
let v=cariSearch.value.toLowerCase();
let liste=cari.filter(c=>c.toLowerCase().includes(v));

let html="<table>";
liste.forEach(c=>{
html+=`<tr><td>${c}</td></tr>`;
});
html+="</table>";

cariList.innerHTML=html;
}

function cariSil(i){
if(confirm("Silmek istediğinize emin misiniz?")){
cari.splice(i,1);
localStorage.setItem("cari",JSON.stringify(cari));
renderCari();
}
}

function cariDuzenle(i){
let yeni=prompt("Cari adı",cari[i]);
if(!yeni) return;

if(cari.find((x,idx)=>x.toLowerCase()==yeni.toLowerCase() && idx!=i)){
alert("Zaten var");return;
}

cari[i]=yeni;
localStorage.setItem("cari",JSON.stringify(cari));
renderCari();
}

/* CARİ SEÇ */
function cariSecAc(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
cariSec.classList.remove("hidden");
cariFiltre2();
}

function cariFiltre2(){
let v=cariSearch2.value.toLowerCase();
let liste=cari.filter(c=>c.toLowerCase().includes(v));

let html="<table>";
liste.forEach(c=>{
html+=`<tr>
<td>${c}</td>
<td><button onclick="cariSecim('${c}')">Seç</button></td>
</tr>`;
});
html+="</table>";

cariSecList.innerHTML=html;
}

function cariSecim(c){
cariSelect.value=c;
geriAlis();
}

function geriAlis(){openPage("alis");}

/* ALIŞ */
function initAlis(){
belgeNo.value="ALIS-"+Date.now();
cariSelect.innerHTML="";
cari.forEach(c=>{
cariSelect.innerHTML+=`<option>${c}</option>`;
});
}

function barkodAc(){
if(!cariSelect.value){
alert("Cari seç!");
return;
}
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
barkodPage.classList.remove("hidden");
}

/* ÜRÜN */
function urunGetir(){
let urun=stok.find(x=>x.barkod==barkodInput.value);
if(!urun){alert("Yok");return;}

aktifUrun=urun;

urunInfo.innerHTML=`<b>${urun.urun}</b><br>Stok: ${urun.adet}`;
adet.value="";
}

/* EKLE */
function ekle(){
if(!aktifUrun||!adet.value) return;

let a=Number(adet.value);
aktifUrun.adet+=a;

alis.push({belge:belgeNo.value,urun:aktifUrun.urun,adet:a});

localStorage.setItem("stok",JSON.stringify(stok));
localStorage.setItem("alis",JSON.stringify(alis));

aktifUrun=null;
barkodInput.value="";
adet.value="";
urunInfo.innerHTML="";

alert("Eklendi");
}

/* LİSTE */
function toggleListe(){
listeAcik=!listeAcik;

if(listeAcik){
let l=alis.filter(x=>x.belge==belgeNo.value);
let html="<table>";
l.forEach((x,i)=>{
html+=`<tr><td>${i+1}</td><td>${x.urun}</td><td>${x.adet}</td></tr>`;
});
html+="</table>";
liste.innerHTML=html;
}else{
liste.innerHTML="";
}
}

/* CAMERA */
function kamera(){
stopCam();
scanner=new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(dev=>{
let cam=dev.find(d=>d.label.toLowerCase().includes("back"))||dev[0];

scanner.start(cam.id,{fps:10,qrbox:250},(text)=>{
barkodInput.value=text;
stopCam();
});
});
}

function stopCam(){
if(scanner){
scanner.stop().then(()=>scanner.clear()).catch(()=>{});
scanner=null;
}
}

function geri(){openPage("alis");}

</script>

</body>
</html>
