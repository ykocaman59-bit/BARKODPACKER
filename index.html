<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BARKODPACKER ERP v5.0</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --p: #1e40af; --s: #f97316; --g: #16a34a; --r: #dc2626; --bg: #f8fafc; }
        * { box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); }
        
        /* Nitrogen Splash & Setup */
        #splash { position: fixed; inset: 0; background: #1e40af; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .setup-modal { background: white; color: #333; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        
        /* Navbar */
        .nav { background: var(--p); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index: 100; }
        
        /* Layout */
        .container { padding: 15px; display: none; animation: fadeIn 0.3s; }
        .active { display: block; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        
        /* Buttons & Inputs */
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn-p { background: var(--p); color: white; }
        .btn-s { background: var(--s); color: white; }
        .btn-g { background: var(--g); color: white; }
        .btn-r { background: var(--r); color: white; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #f1f5f9; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<!-- NITROGEN STYLE SPLASH -->
<div id="splash">
    <div id="loader">
        <h1 style="letter-spacing: 2px;">BARKOD<span style="color:var(--s)">PACKER</span></h1>
        <p id="status">Sistem Kontrol Ediliyor...</p>
        <button class="btn-s" style="width:auto" onclick="showSetup()">UYGULAMAYI GÜNCELLE</button>
    </div>

    <div id="setupBox" class="setup-modal">
        <h2 style="margin-top:0">Nitrogen Kurulum</h2>
        <input id="set_ip" placeholder="Sunucu IP (Örn: 212.156.42.190)">
        <input id="set_port" placeholder="Port (Örn: 8081)">
        <select id="set_role">
            <option value="">Firma Tipi Seçin</option>
            <option value="Merkez Depo">Merkez Depo</option>
            <option value="Sube 1">Şube 1</option>
            <option value="Sube 2">Şube 2</option>
        </select>
        <button class="btn-p" onclick="saveSetup()">KAYDET VE GÜNCELLE</button>
        <button style="background:none; color: #666;" onclick="closeSetup()">Vazgeç</button>
    </div>
</div>

<!-- APP NAVBAR -->
<div class="nav" id="appNav" style="display:none">
    <div><b id="navFirmaName">Firma</b></div>
    <button onclick="logout()" style="width:auto; margin:0; background:rgba(255,255,255,0.2); padding: 5px 12px;">ÇIKIŞ</button>
</div>

<!-- MERKEZ PANEL -->
<div id="p_merkez" class="container">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="btn-p" onclick="nav('p_merkezUrun')">📦 Ürün Tanımla</button>
        <button class="btn-p" onclick="nav('p_merkezSubeYonetim')">👥 Şube Stokları</button>
        <button class="btn-s" onclick="nav('p_merkezGelenSiparis')">🔔 Gelen Siparişler</button>
        <button class="btn-g" onclick="nav('p_merkezStokGiris')">📥 Mal Kabul (Merkez)</button>
    </div>
</div>

<!-- ŞUBE PANEL -->
<div id="p_sube" class="container">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="btn-p" onclick="nav('p_subeStoklarim')">📦 Kendi Stoğum</button>
        <button class="btn-s" onclick="nav('p_subeDepoSiparis')">🚚 Depo Siparişi</button>
        <button class="btn-g" onclick="nav('p_subeGelenOnay')">✅ Gelen Ürünler</button>
        <button class="btn-p" onclick="nav('p_subeMalKabul')">📥 Mal Kabul (Şube)</button>
    </div>
</div>

<!-- SAYFA: ÜRÜN TANIMLA (MERKEZ) -->
<div id="p_merkezUrun" class="container">
    <h3>Yeni Ürün Kartı (Global)</h3>
    <div class="card">
        <input id="m_u_barkod" placeholder="Barkod No">
        <input id="m_u_ad" placeholder="Ürün Adı">
        <button class="btn-g" onclick="addUrunGlobal()">SİSTEME EKLE</button>
    </div>
    <div id="m_urun_list"></div>
    <button onclick="goHome()">GERİ</button>
</div>

<!-- SAYFA: DEPO SİPARİŞİ (ŞUBE) -->
<div id="p_subeDepoSiparis" class="container">
    <h3>Depodan Sipariş Çek</h3>
    <p style="font-size:11px; color:#666">* Sadece merkezde 500+ olan ürünler listelenir.</p>
    <div id="sube_siparis_tablo"></div>
    <button class="btn-s" onclick="sendSiparisToMerkez()">SİPARİŞİ TAMAMLA</button>
    <button onclick="goHome()">VAZGEÇ</button>
</div>

<!-- SAYFA: MERKEZ GELEN SİPARİŞLER -->
<div id="p_merkezGelenSiparis" class="container">
    <h3>Şubelerin Talepleri</h3>
    <div id="merkez_sip_listesi"></div>
    <button onclick="goHome()">GERİ</button>
</div>

<!-- SAYFA: ŞUBE GELEN ÜRÜN ONAYI -->
<div id="p_subeGelenOnay" class="container">
    <h3>Gelen Ürün Kontrol & Sayım</h3>
    <div id="sube_onay_listesi"></div>
    <button onclick="goHome()">GERİ</button>
</div>

<script>
// --- VERİ TABANI ---
let config = JSON.parse(localStorage.getItem("bp_config") || '{"setup":false}');
let db_urunler = JSON.parse(localStorage.getItem("db_urunler") || '[]'); // Barkod, Ad
let db_stoklar = JSON.parse(localStorage.getItem("db_stoklar") || '{"Merkez":{}}'); // { "Sube 1": {"123": 50} }
let db_siparisler = JSON.parse(localStorage.getItem("db_siparisler") || '[]'); // Sipariş geçmişi

// --- INITIALIZE ---
window.onload = () => {
    if(config.setup) {
        startApp();
    } else {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('setupBox').style.display = 'block';
    }
};

function showSetup() {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('setupBox').style.display = 'block';
}

function saveSetup() {
    const role = document.getElementById('set_role').value;
    const ip = document.getElementById('set_ip').value;
    if(!role || !ip) return alert("Lütfen bilgileri girin!");
    
    config = { setup: true, role: role, ip: ip };
    localStorage.setItem("bp_config", JSON.stringify(config));
    location.reload();
}

function startApp() {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('appNav').style.display = 'flex';
    document.getElementById('navFirmaName').innerText = config.role;
    goHome();
}

function nav(id) {
    document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    
    if(id === 'p_merkezUrun') renderMerkezUrunler();
    if(id === 'p_subeDepoSiparis') renderSubeSiparisEkrani();
    if(id === 'p_merkezGelenSiparis') renderMerkezGelenSiparisler();
    if(id === 'p_subeGelenOnay') renderSubeGelenOnayListesi();
}

function goHome() {
    if(config.role === "Merkez Depo") nav('p_merkez');
    else nav('p_sube');
}

// --- MERKEZ MANTIĞI ---
function addUrunGlobal() {
    let b = document.getElementById('m_u_barkod').value;
    let a = document.getElementById('m_u_ad').value;
    if(b && a) {
        db_urunler.push({ barkod: b, ad: a });
        localStorage.setItem("db_urunler", JSON.stringify(db_urunler));
        renderMerkezUrunler();
        alert("Ürün Tanımlandı.");
    }
}

function renderMerkezUrunler() {
    let h = "";
    db_urunler.forEach(u => {
        let mStok = db_stoklar["Merkez"][u.barkod] || 0;
        h += `<div class="card"><b>${u.ad}</b><br><small>Barkod: ${u.barkod} | Merkez Stok: ${mStok}</small></div>`;
    });
    document.getElementById('m_urun_list').innerHTML = h;
}

// --- ŞUBE SİPARİŞ (500 ADET BARAJI) ---
function renderSubeSiparisEkrani() {
    // Alfabetik sırala
    let siraliUrunler = [...db_urunler].sort((a,b) => a.ad.localeCompare(b.ad));
    let h = "<table><thead><tr><th>Ürün</th><th>Depo</th><th>Sipariş</th></tr></thead><tbody>";
    
    let urunBulundu = false;
    siraliUrunler.forEach(u => {
        let depoMiktari = db_stoklar["Merkez"][u.barkod] || 0;
        if(depoMiktari >= 500) {
            urunBulundu = true;
            h += `<tr>
                <td>${u.ad}</td>
                <td>${depoMiktari}</td>
                <td>
                    <div style="display:flex; gap:2px;">
                        <button onclick="chg('${u.barkod}', -1)" style="padding:5px; margin:0">-</button>
                        <input id="qty_${u.barkod}" type="number" value="0" style="width:50px; margin:0; text-align:center">
                        <button onclick="chg('${u.barkod}', 1)" style="padding:5px; margin:0">+</button>
                    </div>
                </td>
            </tr>`;
        }
    });
    h += "</tbody></table>";
    document.getElementById('sube_siparis_tablo').innerHTML = urunBulundu ? h : "Depoda 500 adet üzerinde ürün kalmamış.";
}

function chg(id, v) {
    let el = document.getElementById('qty_'+id);
    let n = parseInt(el.value) + v;
    el.value = n < 0 ? 0 : n;
}

function sendSiparisToMerkez() {
    let sepet = [];
    db_urunler.forEach(u => {
        let q = parseInt(document.getElementById('qty_'+u.barkod)?.value || 0);
        if(q > 0) sepet.push({ barkod: u.barkod, ad: u.ad, miktar: q });
    });
    
    if(sepet.length > 0) {
        db_siparisler.push({
            id: Date.now(),
            sube: config.role,
            kalemler: sepet,
            durum: "BEKLIYOR",
            tarih: new Date().toLocaleString()
        });
        localStorage.setItem("db_siparisler", JSON.stringify(db_siparisler));
        alert("Sipariş Merkeze İletildi!");
        goHome();
    }
}

// --- MERKEZ ONAY EKRANI ---
function renderMerkezGelenSiparisler() {
    let h = "";
    db_siparisler.filter(s => s.durum === "BEKLIYOR").forEach(s => {
        h += `<div class="card">
            <b>${s.sube}</b> - ${s.tarih}<hr>
            ${s.kalemler.map(k => `<div>${k.ad}: ${k.miktar} Adet</div>`).join('')}
            <button class="btn-s" onclick="merkezSevkiyatYap(${s.id})">ONAYLA VE GÖNDER</button>
        </div>`;
    });
    document.getElementById('merkez_sip_listesi').innerHTML = h || "Bekleyen talep yok.";
}

function merkezSevkiyatYap(id) {
    let sip = db_siparisler.find(x => x.id === id);
    sip.durum = "YOLDA";
    localStorage.setItem("db_siparisler", JSON.stringify(db_siparisler));
    alert("Ürünler yola çıktı. Şube onayı bekleniyor.");
    renderMerkezGelenSiparisler();
}

// --- ŞUBE KESİN ONAY VE STOK DÜŞÜMÜ ---
function renderSubeGelenOnayListesi() {
    let h = "";
    db_siparisler.filter(s => s.sube === config.role && s.durum === "YOLDA").forEach(s => {
        h += `<div class="card">
            <b>Sevkiyat No: ${s.id}</b><br>
            ${s.kalemler.map(k => `
                <div style="margin:10px 0; border-bottom:1px solid #eee; padding-bottom:5px;">
                    <b>${k.ad}</b> (İstenen: ${k.miktar})<br>
                    Sayılan/Gelen: <input id="final_${s.id}_${k.barkod}" type="number" value="${k.miktar}" style="width:80px">
                </div>
            `).join('')}
            <button class="btn-g" onclick="finalOnayKabul(${s.id})">✅ SAYIMI ONAYLA VE STOĞA AL</button>
        </div>`;
    });
    document.getElementById('sube_onay_listesi').innerHTML = h || "Yolda olan ürününüz yok.";
}

function finalOnayKabul(sid) {
    let sip = db_siparisler.find(x => x.id === sid);
    
    sip.kalemler.forEach(k => {
        let gelenMiktar = parseInt(document.getElementById(`final_${sid}_${k.barkod}`).value);
        
        // 1. Merkez Stoktan Düş (Hatalı/Eksik olsa bile gerçek miktar düşer)
        if(!db_stoklar["Merkez"][k.barkod]) db_stoklar["Merkez"][k.barkod] = 0;
        db_stoklar["Merkez"][k.barkod] -= gelenMiktar;
        
        // 2. Şube Stoğuna Ekle
        if(!db_stoklar[config.role]) db_stoklar[config.role] = {};
        let eski = db_stoklar[config.role][k.barkod] || 0;
        db_stoklar[config.role][k.barkod] = eski + gelenMiktar;
    });
    
    sip.durum = "TAMAMLANDI";
    localStorage.setItem("db_stoklar", JSON.stringify(db_stoklar));
    localStorage.setItem("db_siparisler", JSON.stringify(db_siparisler));
    alert("İşlem başarıyla tamamlandı. Stoklar güncellendi.");
    goHome();
}

function logout() {
    if(confirm("Firmadan çıkış yapılacak?")) {
        localStorage.removeItem("bp_config");
        location.reload();
    }
}
</script>
</body>
</html>
