<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BARKODPACKER ERP V5.0 - FULL ÇALIŞAN SİSTEM</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --primary: #4a90e2; --secondary: #5cb8d1; --danger: #ff5e5e; --success: #28a745; --navy: #2c3e50; --bg: #f4f7f9; }
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        input { -webkit-user-select: text; user-select: text; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow-x: hidden; }
        
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .navbar { background: var(--primary); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; border-radius: 8px; padding: 6px 12px; color: white; font-weight: bold; }
        
        .box { padding: 15px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hidden { display: none !important; }
        
        button { width: 100%; padding: 16px; margin: 8px 0; border: none; border-radius: 12px; background: var(--primary); color: white; font-weight: bold; font-size: 14px; cursor: pointer; }
        button:active { transform: scale(0.98); }
        input, select { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline:none; }

        .order-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        .order-table th { background: #eee; padding: 12px; text-align: left; font-size: 13px; border-bottom: 2px solid #ddd; }
        .order-table td { padding: 10px; border-bottom: 1px solid #eee; }
        
        .qty-box { display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
        .qty-btn { width: 38px !important; height: 38px; padding: 0 !important; margin: 0 !important; border-radius: 8px !important; font-size: 20px; }
        .qty-input { width: 65px !important; margin: 0 !important; text-align: center; padding: 8px !important; font-weight: bold; border: 1px solid #ccc !important; }

        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #toast { visibility: hidden; min-width: 200px; background: #333; color: #fff; text-align: center; border-radius: 50px; padding: 12px; position: fixed; z-index: 10000; left: 50%; bottom: 50px; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: f-in 0.5s, f-out 0.5s 2.5s; }
        @keyframes f-in { from {bottom: 0; opacity: 0;} to {bottom: 50px; opacity: 1;} }
        @keyframes f-out { from {bottom: 50px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        
        #reader { width: 100%; max-width: 400px; margin: auto; border-radius: 15px; overflow: hidden; display: none; }
    </style>
</head>
<body>

<div id="splash"><h1>BARKOD<span>PACKER</span></h1><p>Sistem Hazırlanıyor...</p></div>
<div id="toast">İşlem Başarılı</div>

<div id="loginPage" class="box" style="text-align:center; margin-top:50px;">
    <div style="font-size: 60px;">📦</div>
    <h2>BARKODPACKER ERP</h2>
    <div id="noFirma">
        <button onclick="openPage('updateMethodPage')" style="background:var(--navy)">⚙️ UYGULAMAYI GÜNCELLE / GİRİŞ</button>
    </div>
    <div id="hasFirma" class="hidden">
        <div style="border: 2px dashed var(--primary); padding:20px; border-radius:15px; margin-bottom:20px;">
            <h3 id="currentFirma" style="margin:0; color:var(--primary)">-</h3>
        </div>
        <button onclick="enterSystem()">SİSTEME GİRİŞ</button>
        <button onclick="deleteFirma()" style="background:var(--danger)">🗑️ FİRMAYI CİHAZDAN SİL</button>
    </div>
</div>

<div id="updateMethodPage" class="box hidden">
    <h3>Yöntem Seçin</h3>
    <button onclick="openPage('adminPage')">🏢 MERKEZ DEPO GİRİŞİ</button>
    <button onclick="openPage('subeEntryPage')" style="background:var(--secondary)">🏪 ŞUBE GİRİŞİ (ANAHTAR)</button>
    <button onclick="openPage('loginPage')" style="background:var(--danger)">VAZGEÇ</button>
</div>

<div id="adminPage" class="box hidden">
    <input id="admU" placeholder="Kullanıcı Adı">
    <input id="admP" type="password" placeholder="Şifre">
    <button onclick="doAdminLogin()" style="background:var(--success)">GİRİŞ YAP</button>
</div>

<div id="subeEntryPage" class="box hidden">
    <input id="k1" type="number" inputmode="numeric" placeholder="1. Anahtar Kod">
    <input id="k2" type="number" inputmode="numeric" placeholder="2. Anahtar Kod">
    <button onclick="doSubeLogin()" style="background:var(--success)">DOĞRULA VE GİR</button>
</div>

<div id="nav" class="navbar hidden">
    <div><b id="navF">Firma</b></div>
    <button class="nav-btn" onclick="goHome()">🏠 ANA SAYFA</button>
</div>

<div id="homePage" class="box hidden">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button onclick="openPage('stokPage')">📦 Stok Kartları</button>
        <button onclick="openPage('siparisSelectPage')" style="background:var(--warning-orange)">🚚 Depo Siparişi</button>
        <button onclick="initIslem('ALIS')">📥 Alış İrsaliyesi</button>
        <button onclick="initIslem('SATIS')" style="background:var(--secondary)">📤 Satış İrsaliyesi</button>
        <button onclick="openPage('gecmisPage')">📜 Evrak Geçmişi</button>
        <button onclick="openPage('cariPage')" style="background:var(--secondary)">👥 Cari Kartlar</button>
        <button id="adminBtn1" onclick="openPage('subeManagePage')" class="hidden" style="background:#8e44ad">⚙️ Şube Yönetimi</button>
    </div>
    <button onclick="location.reload()" style="background:var(--danger); margin-top:20px;">GÜVENLİ ÇIKIŞ</button>
</div>

<div id="islemPage" class="box hidden">
    <h3 id="islemTitle">İşlem</h3>
    <div class="card" style="flex-direction:column; align-items:flex-start;">
        <div><b>Belge No:</b> <span id="dispNo">-</span></div>
        <div><b>Cari:</b> <span id="dispCari">Seçilmedi</span></div>
    </div>
    <button onclick="openPage('cariSecPage')" style="background:var(--navy)">👤 CARİ SEÇ</button>
    
    <div style="display:flex; gap:10px;">
        <input id="bInp" placeholder="Barkod Okut veya Yaz" style="margin:0" onkeyup="if(event.keyCode===13) urunEkle()">
        <button onclick="startScan()" style="width:70px; margin:0">📷</button>
    </div>
    <div id="reader"></div>
    
    <div style="max-height: 250px; overflow-y:auto; margin-top:15px; background:white; border-radius:12px;">
        <table class="order-table">
            <thead><tr><th>Ürün</th><th>Mkt</th><th>Sil</th></tr></thead>
            <tbody id="islemBody"></tbody>
        </table>
    </div>
    
    <button onclick="evrakKaydet()" style="background:var(--success); margin-top:15px;">✅ EVRAKI TAMAMLA VE KAYDET</button>
    <button onclick="goHome()" style="background:var(--danger)">İPTAL</button>
</div>

<div id="cariSecPage" class="box hidden">
    <h3>Cari Seçimi</h3>
    <input id="cAra" placeholder="Cari Ara..." oninput="listCariSec()">
    <div id="cariSecList"></div>
    <button onclick="openPage('islemPage')" style="background:var(--danger)">VAZGEÇ</button>
</div>

<div id="siparisSelectPage" class="box hidden">
    <h3>Depo Siparişi</h3>
    <button style="background:#27ae60" onclick="openOrderTab('MANAV')">🍎 MANAV</button>
    <button style="background:#2980b9" onclick="openOrderTab('GIDA')">🧀 GIDA</button>
    <button style="background:#8e44ad" onclick="openOrderTab('TEMİZLİK')">🧼 TEMİZLİK</button>
</div>

<div id="orderTabPage" class="box hidden">
    <h3 id="orderTitle">-</h3>
    <div id="orderContent" style="max-height:400px; overflow-y:auto;">
        <table class="order-table"><tbody id="orderBody"></tbody></table>
    </div>
    <button onclick="sendOrder()" style="background:var(--success)">✅ SİPARİŞİ GÖNDER</button>
    <button onclick="openPage('siparisSelectPage')" style="background:var(--danger)">GERİ</button>
</div>

<div id="subeManagePage" class="box hidden">
    <h3>Şube Yönetimi</h3>
    <input id="newS" placeholder="Şube Adı">
    <button onclick="addSube()" style="background:var(--success)">EKLE</button>
    <div id="subeList"></div>
</div>

<div id="stokPage" class="box hidden">
    <h3>Stok Kartları</h3>
    <input id="sAra" placeholder="Ara..." oninput="listStok()">
    <div id="stokList"></div>
</div>

<div id="cariPage" class="box hidden">
    <h3>Cari Kartlar</h3>
    <input id="newCari" placeholder="Cari Ünvanı">
    <button onclick="addCari()" style="background:var(--success)">YENİ CARİ EKLE</button>
    <div id="cariList"></div>
    <button onclick="goHome()" style="background:var(--secondary)">GERİ</button>
</div>

<div id="gecmisPage" class="box hidden">
    <h3>Evrak Arşivi</h3>
    <div id="evrakList"></div>
    <button onclick="goHome()" style="background:var(--secondary)">GERİ</button>
</div>

<script>
// --- VERİTABANI ---
let db_s = JSON.parse(localStorage.getItem("erp_stok") || '[{"b":"111","a":"Ekmek","k":"GIDA","s":100},{"b":"222","a":"Domates","k":"MANAV","s":50}]');
let db_c = JSON.parse(localStorage.getItem("erp_cari") || '["Dilek Gıda","Grosper Market"]');
let db_e = JSON.parse(localStorage.getItem("erp_evrak") || '[]');
let db_subeler = JSON.parse(localStorage.getItem("erp_subeler") || '[]');
let firma = localStorage.getItem("erp_active_firma") || "";
let currentEvrak = { no: "", cari: "Seçilmedi", kalemler: [], tur: "" };
let scanner = null;

window.onload = () => { setTimeout(() => { document.getElementById('splash').style.display='none'; if(firma) { document.getElementById('noFirma').classList.add('hidden'); document.getElementById('hasFirma').classList.remove('hidden'); document.getElementById('currentFirma').innerText = firma; } }, 1000); };

// --- GİRİŞ ---
function doAdminLogin() { if(document.getElementById('admU').value==="admin" && document.getElementById('admP').value==="1234") { localStorage.setItem("erp_active_firma","Merkez Depo"); location.reload(); } }
function doSubeLogin() { let k1=document.getElementById('k1').value; let k2=document.getElementById('k2').value; let s=db_subeler.find(x=>x.key1==k1 && x.key2==k2); if(s) { localStorage.setItem("erp_active_firma", s.name); location.reload(); } else alert("Hatalı!"); }
function enterSystem() { document.getElementById('navF').innerText=firma; document.getElementById('loginPage').classList.add('hidden'); document.getElementById('nav').classList.remove('hidden'); if(firma==="Merkez Depo") document.getElementById('adminBtn1').classList.remove('hidden'); goHome(); }
function deleteFirma() { localStorage.removeItem("erp_active_firma"); location.reload(); }

// --- NAVİGASYON ---
function openPage(id) { document.querySelectorAll('.box').forEach(b=>b.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); stopScan(); if(id==='stokPage') listStok(); if(id==='subeManagePage') listSubeler(); if(id==='cariPage') listCari(); if(id==='gecmisPage') listEvraklar(); }
function goHome() { openPage('homePage'); }

// --- İŞLEM MANTIĞI (ALIŞ/SATIŞ) ---
function initIslem(tur) {
    currentEvrak = { no: "EVR-" + Math.floor(1000 + Math.random()*9000), cari: "Seçilmedi", kalemler: [], tur: tur };
    document.getElementById('islemTitle').innerText = (tur === 'ALIS' ? "Alış İrsaliyesi" : "Satış İrsaliyesi");
    renderIslem();
    openPage('islemPage');
}

function renderIslem() {
    document.getElementById('dispNo').innerText = currentEvrak.no;
    document.getElementById('dispCari').innerText = currentEvrak.cari;
    let h = "";
    currentEvrak.kalemler.forEach((k, i) => {
        h += `<tr><td>${k.a}</td><td>${k.q}</td><td><button onclick="removeKalem(${i})" style="padding:5px; background:red; margin:0;">X</button></td></tr>`;
    });
    document.getElementById('islemBody').innerHTML = h;
}

function urunEkle() {
    let b = document.getElementById('bInp').value;
    let u = db_s.find(x => x.b === b);
    if(u) {
        let q = prompt(u.a + " için miktar:", "1");
        if(q && !isNaN(q)) {
            currentEvrak.kalemler.push({ b: u.b, a: u.a, q: parseInt(q) });
            document.getElementById('bInp').value = "";
            renderIslem();
        }
    } else alert("Ürün bulunamadı!");
}

function removeKalem(i) { currentEvrak.kalemler.splice(i,1); renderIslem(); }

function evrakKaydet() {
    if(currentEvrak.cari === "Seçilmedi" || currentEvrak.kalemler.length === 0) return alert("Cari veya ürün eksik!");
    db_e.push({...currentEvrak, tarih: new Date().toLocaleDateString()});
    localStorage.setItem("erp_evrak", JSON.stringify(db_e));
    toast("Evrak Kaydedildi");
    goHome();
}

// --- CARİ SEÇİM ---
function listCariSec() {
    let h = ""; let ara = document.getElementById('cAra').value.toLowerCase();
    db_c.forEach(c => { if(c.toLowerCase().includes(ara)) h += `<div class="card" onclick="selectCari('${c}')">${c}</div>`; });
    document.getElementById('cariSecList').innerHTML = h;
}
function selectCari(c) { currentEvrak.cari = c; renderIslem(); openPage('islemPage'); }

// --- DEPO SİPARİŞ (TABLO) ---
let siparisTemp = {};
function openOrderTab(kat) {
    document.getElementById('orderTitle').innerText = kat + " Sipariş Formu";
    let items = db_s.filter(x => x.k === kat).sort((a,b)=>a.a.localeCompare(b.a));
    let h = ""; siparisTemp = {};
    items.forEach(u => {
        siparisTemp[u.b] = 0;
        h += `<tr><td>${u.a}</td><td><div class="qty-box">
            <button class="qty-btn" style="background:var(--danger)" onclick="chgQ('${u.b}',-1)">-</button>
            <input type="number" inputmode="numeric" class="qty-input" id="sq-${u.b}" value="0" onchange="manQ('${u.b}',this.value)">
            <button class="qty-btn" style="background:var(--success)" onclick="chgQ('${u.b}',1)">+</button>
        </div></td></tr>`;
    });
    document.getElementById('orderBody').innerHTML = h || "Ürün yok";
    openPage('orderTabPage');
}
function chgQ(b, v) { let i=document.getElementById('sq-'+b); let n=parseInt(i.value)+v; if(n<0)n=0; i.value=n; siparisTemp[b]=n; }
function manQ(b, v) { siparisTemp[b] = parseInt(v) || 0; }
function sendOrder() { alert("Sipariş başarıyla merkeze iletildi."); goHome(); }

// --- DİĞER LİSTELEME FONKSİYONLARI ---
function listStok() {
    let h = ""; let ara = document.getElementById('sAra').value.toLowerCase();
    db_s.forEach(u => { if(u.a.toLowerCase().includes(ara)) h += `<div class="card"><div><b>${u.a}</b><br><small>${u.b}</small></div><b>${u.s}</b></div>`; });
    document.getElementById('stokList').innerHTML = h;
}

function listCari() {
    let h = ""; db_c.forEach(c => { h += `<div class="card">${c}</div>`; });
    document.getElementById('cariList').innerHTML = h;
}

function addCari() { let n = document.getElementById('newCari').value; if(n) { db_c.push(n); localStorage.setItem("erp_cari", JSON.stringify(db_c)); listCari(); } }

function listSubeler() {
    let h = ""; db_subeler.forEach((s,i) => { h += `<div class="card" onclick="alert('Anahtarlar: ${s.key1} - ${s.key2}')">${s.name}</div>`; });
    document.getElementById('subeList').innerHTML = h;
}

function addSube() { let n=document.getElementById('newS').value; if(n){ db_subeler.push({name:n, key1:Math.floor(1000+Math.random()*9000), key2:Math.floor(1000+Math.random()*9000)}); localStorage.setItem("erp_subeler", JSON.stringify(db_subeler)); listSubeler(); } }

function listEvraklar() {
    let h = ""; db_e.reverse().forEach(e => { h += `<div class="card"><div><b>${e.no}</b> (${e.tur})<br>${e.cari}</div><small>${e.tarih}</small></div>`; });
    document.getElementById('evrakList').innerHTML = h || "Evrak yok";
}

// --- ARAÇLAR ---
function toast(m) { let x=document.getElementById("toast"); x.innerText=m; x.className="show"; setTimeout(()=>x.className="",3000); }
function startScan() { document.getElementById('reader').style.display='block'; scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }); scanner.render((txt)=>{ document.getElementById('bInp').value=txt; stopScan(); urunEkle(); }); }
function stopScan() { if(scanner){ scanner.clear(); document.getElementById('reader').style.display='none'; } }
</script>
</body>
</html>
