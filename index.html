<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER ERP</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.box{max-width:520px;margin:15px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}

input,button,select{
width:100%;
padding:10px;
margin:5px 0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.top{display:flex;justify-content:space-between;}

.exit{
position:fixed;
bottom:70px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
padding:12px 25px;
border:none;
border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
<h2>BARKODPACKER</h2>

<input id="user" placeholder="Kullanıcı adı">
<input id="pass" type="password" placeholder="Şifre">

<select id="firma">
<option>Firma Seçiniz</option>
<option>Demo</option>
<option>Test LTD</option>
</select>

<button onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">
<h3 style="text-align:center;">ANA SAYFA</h3>

<table>
<tr>
<td><button onclick="openPage('stok')">STOK</button></td>
<td><button onclick="openPage('sayim')">SAYIM</button></td>
</tr>
<tr>
<td><button onclick="openPage('alis')">ALIŞ</button></td>
<td><button onclick="openPage('satis')">SATIŞ</button></td>
</tr>
<tr>
<td colspan="2"><button onclick="openPage('cari')">CARİ</button></td>
</tr>
</table>

<button class="exit" onclick="logout()">ÇIKIŞ</button>
</div>

<!-- STOK -->
<div class="box hidden" id="stok">
<div class="top">
<button onclick="home()">🏠</button>
<h3>STOK</h3>
</div>

<input id="stokBarkod" placeholder="Barkod">
<input id="stokUrun" placeholder="Ürün">

<button onclick="stokEkle()">EKLE</button>

<div id="stokList"></div>
</div>

<!-- CARİ -->
<div class="box hidden" id="cari">
<div class="top">
<button onclick="home()">🏠</button>
<h3>CARİ</h3>
</div>

<input id="cariInput" placeholder="Cari adı">
<button onclick="cariEkle()">EKLE</button>

<input id="cariSearch" placeholder="Ara">
<button onclick="cariFiltre()">Filtrele</button>

<div id="cariList"></div>
</div>

<!-- ALIŞ -->
<div class="box hidden" id="alis">

<div class="top">
<button onclick="home()">🏠</button>
<h3>ALIŞ</h3>
</div>

<div>
<b>Belge:</b> <span id="labelBelge">-</span><br>
<b>Cari:</b> <span id="labelCari">Seçilmedi</span>
</div>

<input value="BARKODPACKER-PDA" disabled>

<button onclick="belgePage()">BELGE NO</button>
<button onclick="cariSecAc()">CARİ SEÇ</button>
<button onclick="barkodAc()">BARKOD GİRİŞ</button>

</div>

<!-- BELGE -->
<div class="box hidden" id="belgePage">
<button onclick="geriAlis()">⬅</button>

<h3>Belge No</h3>

<input id="belge1" placeholder="Belge No">
<input id="belge2" placeholder="Alternatif">

<button onclick="belgeKaydet()">KAYDET</button>
</div>

<!-- CARİ SEÇ -->
<div class="box hidden" id="cariSec">
<button onclick="geriAlis()">⬅</button>

<input id="cariSearch2">
<button onclick="cariFiltre2()">Filtrele</button>

<div id="cariSecList"></div>
</div>

<!-- BARKOD -->
<div class="box hidden" id="barkodPage">

<div class="top">
<button onclick="geriAlis()">⬅</button>
</div>

<input id="barkodInput">
<button onclick="urunGetir()">GETİR</button>

<button onclick="kamera()">📷 OKU</button>

<div id="reader"></div>

<div id="urunInfo"></div>

<input id="adet" type="number" placeholder="Adet">
<button onclick="ekle()">EKLE</button>

<div id="liste"></div>

</div>

<script>

/* DATA */
let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let cari=JSON.parse(localStorage.getItem("cari")||"[]");
let alis=JSON.parse(localStorage.getItem("alis")||"[]");

let aktif=null;
let cam=null;
let belgeNo="";
let cariSecili="";

/* LOGIN */
function login(){
if(user.value==="admin" && pass.value==="1234" && firma.value!=="Firma Seçiniz"){
loginPage.classList.add("hidden");
homePage.classList.remove("hidden");
}
}

function logout(){location.reload();}

/* NAV */
function openPage(id){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");

if(id==="stok") renderStok();
if(id==="cari") renderCari();
if(id==="alis") resetAlisState();
}

function home(){
stopCam();
resetAlisState();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
homePage.classList.remove("hidden");
}

/* RESET SYSTEM (FIX) */
function resetAlisState(){
belgeNo="";
cariSecili="";

labelBelge.innerText="-";
labelCari.innerText="Seçilmedi";

if(belge1) belge1.value="";
if(belge2) belge2.value="";
if(barkodInput) barkodInput.value="";
if(adet) adet.value="";
if(urunInfo) urunInfo.innerHTML="";
}

/* STOK */
function stokEkle(){
if(!stokBarkod.value || !stokUrun.value) return;

if(stok.find(x=>x.barkod===stokBarkod.value)){
alert("Barkod var"); return;
}

stok.push({barkod:stokBarkod.value,urun:stokUrun.value,adet:0});
localStorage.setItem("stok",JSON.stringify(stok));

stokBarkod.value="";
stokUrun.value="";
renderStok();
}

function renderStok(){
let html="<table><tr><th>Barkod</th><th>Ürün</th><th>Adet</th></tr>";
stok.forEach(s=>{
html+=`<tr><td>${s.barkod}</td><td>${s.urun}</td><td>${s.adet}</td></tr>`;
});
html+="</table>";
stokList.innerHTML=html;
}

/* CARİ */
function cariEkle(){
if(!cariInput.value) return;

if(cari.includes(cariInput.value)){
alert("Var");return;
}

cari.push(cariInput.value);
cari.sort();
localStorage.setItem("cari",JSON.stringify(cari));

cariInput.value="";
renderCari();
}

function renderCari(){
let html="<table>";
cari.forEach(c=>{
html+=`<tr><td>${c}</td></tr>`;
});
html+="</table>";
cariList.innerHTML=html;
}

/* BELGE */
function belgePage(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
belgePage.classList.remove("hidden");
}

function belgeKaydet(){
belgeNo=belge1.value||belge2.value;
labelBelge.innerText=belgeNo;
geriAlis();
}

/* CARİ */
function cariSecAc(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
cariSec.classList.remove("hidden");
cariFiltre2();
}

function cariFiltre2(){
let v=cariSearch2.value.toLowerCase();
let liste=cari.filter(x=>x.toLowerCase().includes(v));

let html="<table>";
liste.forEach(c=>{
html+=`<tr><td onclick="secCari('${c}')">${c}</td></tr>`;
});
html+="</table>";

cariSecList.innerHTML=html;
}

function secCari(c){
cariSecili=c;
labelCari.innerText=c;
geriAlis();
}

function geriAlis(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
alis.classList.remove("hidden");
}

/* ALIŞ */
function barkodAc(){
if(!cariSecili){
alert("Firma seçiniz");
return;
}
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
barkodPage.classList.remove("hidden");
}

/* CAMERA */
function kamera(){
stopCam();
cam=new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(dev=>{
let back=dev.find(d=>d.label.toLowerCase().includes("back"))||dev[0];

cam.start(back.id,{fps:10,qrbox:250},txt=>{
barkodInput.value=txt;
stopCam();
});
});
}

function stopCam(){
if(cam){
cam.stop().then(()=>cam.clear());
cam=null;
}
}

/* EKLE */
function ekle(){
if(!aktif||!adet.value) return;

aktif.adet+=Number(adet.value);

alis.push({belge:belgeNo,urun:aktif.urun,adet:adet.value});

localStorage.setItem("stok",JSON.stringify(stok));
localStorage.setItem("alis",JSON.stringify(alis));

adet.value="";
barkodInput.value="";
urunInfo.innerHTML="";
}

</script>

</body>
</html>
