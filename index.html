<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER ERP</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.box{max-width:520px;margin:15px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}

input,button,select{
width:100%;
padding:10px;
margin:5px 0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.top{display:flex;justify-content:space-between;}

.exit{
position:fixed;
bottom:70px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
padding:12px 25px;
border:none;
border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
<h2>BARKODPACKER</h2>

<input id="user" placeholder="Kullanıcı adı">
<input id="pass" type="password" placeholder="Şifre">

<select id="firma">
<option>Firma Seçiniz</option>
<option>Demo</option>
<option>Test LTD</option>
</select>

<button onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">
<h3 style="text-align:center;">ANA SAYFA</h3>

<table>
<tr>
<td><button onclick="openPage('stok')">STOK</button></td>
<td><button onclick="openPage('sayim')">SAYIM</button></td>
</tr>
<tr>
<td><button onclick="openPage('alis')">ALIŞ</button></td>
<td><button onclick="openPage('satis')">SATIŞ</button></td>
</tr>
<tr>
<td colspan="2"><button onclick="openPage('cari')">CARİ</button></td>
</tr>
</table>

<button class="exit" onclick="logout()">ÇIKIŞ</button>
</div>

<!-- STOK -->
<div class="box hidden" id="stok">
<div class="top">
<button onclick="home()">🏠</button>
<h3>STOK</h3>
</div>

<input id="stokBarkod" placeholder="Barkod">
<input id="stokUrun" placeholder="Ürün">

<button onclick="stokEkle()">EKLE</button>

<div id="stokList"></div>
</div>

<!-- CARİ -->
<div class="box hidden" id="cari">
<div class="top">
<button onclick="home()">🏠</button>
<h3>CARİ</h3>
</div>

<input id="cariInput" placeholder="Cari adı">
<button onclick="cariEkle()">EKLE</button>

<input id="cariSearch" placeholder="Ara">
<button onclick="cariFiltre()">Filtrele</button>

<div id="cariList"></div>
</div>

<!-- ALIŞ -->
<div class="box hidden" id="alis">

<div class="top">
<button onclick="home()">🏠</button>
<h3>ALIŞ</h3>
<button onclick="evrakGetirPage()">📄</button>
</div>

<div class="label">
<b>Belge:</b> <span id="labelBelge">-</span><br>
<b>Cari:</b> <span id="labelCari">Seçilmedi</span>
</div>

<input value="BARKODPACKER-PDA" disabled>

<button onclick="belgePage()">BELGE NO</button>
<button onclick="cariSecAc()">CARİ SEÇ</button>
<button onclick="barkodAc()">BARKOD GİRİŞ</button>

</div>

<!-- BELGE -->
<div class="box hidden" id="belgePage">
<button onclick="geriAlis()">⬅</button>

<h3>Belge No</h3>
<input id="belge1" placeholder="Belge No">

<button onclick="belgeKaydet()">KAYDET</button>
</div>

<!-- CARİ SEÇ -->
<div class="box hidden" id="cariSec">
<button onclick="geriAlis()">⬅</button>

<input id="cariSearch2">
<button onclick="cariFiltre2()">Filtrele</button>

<div id="cariSecList"></div>
</div>

<!-- BARKOD -->
<div class="box hidden" id="barkodPage">

<div class="top">
<button onclick="geriAlis()">⬅</button>
</div>

<input id="barkodInput">
<button onclick="urunGetir()">GETİR</button>

<div id="urunInfo"></div>

<input id="adet" type="number" placeholder="Adet">
<button onclick="ekle()">EKLE</button>

</div>

<!-- EVRAK LİSTE -->
<div class="box hidden" id="evrakPage">
<button onclick="home()">⬅</button>

<h3>Evraklar</h3>

<input id="startDate" type="date">
<input id="endDate" type="date">

<button onclick="evrakListele()">EVRAK GETİR</button>

<div id="evrakList"></div>
</div>

<script>

/* DATA */
let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let cari=JSON.parse(localStorage.getItem("cari")||"[]");
let evrak=JSON.parse(localStorage.getItem("evrak")||"[]");

let aktif=null;
let cariSecili="";
let currentEvrak=null;

/* BELGE NO */
function yeniBelgeNo(){
return "ALIŞ-" + Date.now();
}

/* ALIŞ AÇ */
function barkodAc(){

if(!cariSecili){
alert("Cari seçin");
return;
}

document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
barkodPage.classList.remove("hidden");

if(!currentEvrak){
currentEvrak={
id:Date.now(),
belge:yeniBelgeNo(),
cari:cariSecili,
items:[],
date:new Date().toISOString().split("T")[0]
};

labelBelge.innerText=currentEvrak.belge;
labelCari.innerText=cariSecili;
}
}

/* EKLE */
function ekle(){
if(!aktif || !adet.value) return;

aktif.adet += Number(adet.value);

currentEvrak.items.push({
barkod:aktif.barkod,
urun:aktif.urun,
adet:Number(adet.value)
});

adet.value="";
barkodInput.value="";
urunInfo.innerHTML="";
}

/* HOME / ÇIKIŞ KONTROL */
function home(){

if(currentEvrak && currentEvrak.items.length > 0){
evrak.push(currentEvrak);
localStorage.setItem("stok",JSON.stringify(stok));
localStorage.setItem("evrak",JSON.stringify(evrak));
}

currentEvrak=null;

document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
homePage.classList.remove("hidden");
}

/* EVRAK GETİR */
function evrakGetirPage(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
evrakPage.classList.remove("hidden");

let today=new Date().toISOString().split("T")[0];
startDate.value=today;
endDate.value=today;
}

function evrakListele(){

let s=startDate.value;
let e=endDate.value;

let list=evrak.filter(x=>x.date>=s && x.date<=e);

let html="<table>";

list.forEach((e,i)=>{
html+=`<tr>
<td onclick="evrakAc(${i})">${e.belge}</td>
<td><button onclick="evrakSil(${i})">Sil</button></td>
</tr>`;
});

html+="</table>";

evrakList.innerHTML=html;
}

/* EVRAK AÇ */
function evrakAc(i){
currentEvrak=evrak[i];

labelBelge.innerText=currentEvrak.belge;
labelCari.innerText=currentEvrak.cari;

home();
barkodPage.classList.remove("hidden");
}

/* EVRAK SİL + STOK GERİ AL */
function evrakSil(i){

let e=evrak[i];

e.items.forEach(it=>{
let s=stok.find(x=>x.barkod==it.barkod);
if(s) s.adet -= it.adet;
});

evrak.splice(i,1);

localStorage.setItem("stok",JSON.stringify(stok));
localStorage.setItem("evrak",JSON.stringify(evrak));

evrakListele();
}

</script>

</body>
</html>
