<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER</title>

<style>
body { font-family: Arial; margin:0; background:#2d74da; }
.container { max-width:500px; margin:30px auto; background:#fff; padding:15px; border-radius:12px; }
button { padding:10px; margin:5px; width:100%; border:0; border-radius:8px; }
input { width:100%; padding:10px; margin:5px 0; }
.hidden { display:none; }
.menu button { background:#eee; }
.primary { background:#2d74da; color:#fff; }
.danger { background:red; color:#fff; }
ul { padding:0; list-style:none; }
li { padding:8px; border-bottom:1px solid #ddd; }
.topbar { display:flex; justify-content:space-between; }
</style>
</head>

<body>

<div class="container" id="home">

  <h2>BARKODPACKER</h2>

  <div class="menu">
    <button onclick="openPage('stok')">STOK DETAY</button>
    <button onclick="openPage('cari')">CARİ EKLE</button>
    <button onclick="openPage('alis')">ALIŞ İRSALİYESİ</button>
    <button onclick="openPage('satis')">SATIŞ İRSALİYESİ</button>
    <button onclick="openPage('sayim')">SAYIM FİŞİ</button>
  </div>

</div>

<!-- STOK -->
<div class="container hidden" id="stok">
  <div class="topbar">
    <button onclick="openPage('home')">🏠</button>
    <h3>STOK</h3>
  </div>

  <input id="barkod" placeholder="Barkod">
  <input id="urun" placeholder="Ürün adı">
  <input id="adet" placeholder="Adet">

  <button class="primary" onclick="stokEkle()">STOK EKLE</button>

  <ul id="stokList"></ul>
</div>

<!-- CARİ -->
<div class="container hidden" id="cari">
  <div class="topbar">
    <button onclick="openPage('home')">🏠</button>
    <h3>Cari</h3>
  </div>

  <input id="cariInput" placeholder="Cari adı">
  <button class="primary" onclick="cariEkle()">EKLE</button>

  <ul id="cariList"></ul>
</div>

<!-- BASİT JS -->
<script>

let stok = JSON.parse(localStorage.getItem("stok") || "[]");
let cari = JSON.parse(localStorage.getItem("cari") || "[]");

function save(){
  localStorage.setItem("stok", JSON.stringify(stok));
  localStorage.setItem("cari", JSON.stringify(cari));
}

/* SAYFA */
function openPage(id){
  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  if(id==="stok") renderStok();
  if(id==="cari") renderCari();
}

/* STOK EKLE */
function stokEkle(){
  let b = document.getElementById("barkod").value;
  let u = document.getElementById("urun").value;
  let a = parseInt(document.getElementById("adet").value || 0);

  if(!b || !u) return alert("Boş bırakma");

  stok.push({barkod:b, urun:u, adet:a});
  save();
  renderStok();
}

/* STOK SİL */
function sil(i){
  if(confirm("Silinsin mi?")){
    stok.splice(i,1);
    save();
    renderStok();
  }
}

/* STOK GÖSTER */
function renderStok(){
  let list = document.getElementById("stokList");
  list.innerHTML = "";
  stok.forEach((s,i)=>{
    list.innerHTML += `
      <li>
        ${s.barkod} / ${s.urun} / ${s.adet}
        <button onclick="sil(${i})" class="danger">Sil</button>
      </li>`;
  });
}

/* CARİ EKLE */
function cariEkle(){
  let c = document.getElementById("cariInput").value;
  if(!c) return;

  cari.push(c);
  cari.sort();
  save();
  renderCari();
}

function renderCari(){
  let list = document.getElementById("cariList");
  list.innerHTML = "";
  cari.forEach(c=>{
    list.innerHTML += `<li>${c}</li>`;
  });
}

</script>

</body>
</html>
