<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER ERP</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.box{max-width:520px;margin:20px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}

input,button,select{width:100%;padding:10px;margin:5px 0;}
.primary{background:#2d74da;color:#fff;border:0;}
.danger{background:red;color:#fff;border:0;}

table{width:100%;border-collapse:collapse;margin-top:10px;}
td,th{border:1px solid #ddd;padding:8px;text-align:left;}

.top{display:flex;justify-content:space-between;align-items:center;}

.bottomExit{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
padding:12px 25px;
border:none;
border-radius:10px;
}
.blue{background:#2d74da;color:#fff;min-height:100vh;padding:20px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
<h2>BARKODPACKER</h2>

<input id="user" placeholder="Kullanıcı">
<input id="pass" type="password" placeholder="Şifre">

<select id="firma">
<option>Firma Seçiniz</option>
<option>Demo A.Ş</option>
<option>Test Ltd</option>
</select>

<button class="primary" onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">

<div class="top">
<h3>ANA SAYFA</h3>
</div>

<button onclick="openPage('stok')">STOK DETAY</button>
<button onclick="openPage('cari')">CARİ</button>
<button onclick="openPage('alis')">ALIŞ İRSALİYE</button>
<button onclick="openPage('satis')">SATIŞ İRSALİYE</button>
<button onclick="openPage('sayim')">SAYIM FİŞİ</button>

<button class="bottomExit" onclick="logout()">ÇIKIŞ</button>
</div>

<!-- STOK -->
<div class="box hidden" id="stok">
<div class="top">
<button onclick="home()">🏠</button>
<h3>STOK</h3>
</div>

<input id="barkod" placeholder="Barkod">
<input id="urun" placeholder="Ürün">

<button class="primary" onclick="stokEkle()">EKLE</button>
<button onclick="kamera()">📷 OKU</button>

<div id="reader"></div>

<div id="stokList"></div>
</div>

<!-- CARİ -->
<div class="box hidden" id="cari">
<div class="top">
<button onclick="home()">🏠</button>
<h3>CARİ</h3>
</div>

<input id="cariInput" placeholder="Cari adı">
<button class="primary" onclick="cariEkle()">EKLE</button>

<div id="cariList"></div>
</div>

<!-- DOCUMENTS -->
<div class="box hidden blue" id="alis">
<h2>ALIŞ İRSALİYE</h2>
<button onclick="home()">ANA SAYFA</button>
</div>

<div class="box hidden blue" id="satis">
<h2>SATIŞ İRSALİYE</h2>
<button onclick="home()">ANA SAYFA</button>
</div>

<div class="box hidden blue" id="sayim">
<h2>SAYIM FİŞİ</h2>
<button onclick="home()">ANA SAYFA</button>
</div>

<script>

let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let cari=JSON.parse(localStorage.getItem("cari")||"[]");
let scanner=null;

/* LOGIN */
function login(){
if(user.value==="admin" && pass.value==="1234" && firma.value!=="Firma Seçiniz"){
loginPage.classList.add("hidden");
homePage.classList.remove("hidden");
}
}

/* LOGOUT */
function logout(){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
loginPage.classList.remove("hidden");
}

/* NAV */
function openPage(id){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");

if(id==="stok") renderStok();
if(id==="cari") renderCari();
}

function home(){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
homePage.classList.remove("hidden");
}

/* STOK */
function stokEkle(){
stok.push({barkod:barkod.value,urun:urun.value,adet:0});
localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}

function silStok(i){
if(confirm("Silinsin mi?")){
stok.splice(i,1);
localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}
}

function duzenleStok(i){
let b=prompt("Barkod",stok[i].barkod);
let u=prompt("Ürün",stok[i].urun);
if(b&&u){
stok[i]={barkod:b,urun:u,adet:stok[i].adet};
localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}
}

function renderStok(){
let html=`<table>
<tr><th>Barkod</th><th>Ürün</th><th>Adet</th><th>İşlem</th></tr>`;
stok.forEach((s,i)=>{
html+=`<tr>
<td>${s.barkod}</td>
<td>${s.urun}</td>
<td>${s.adet}</td>
<td>
<button onclick="duzenleStok(${i})">Düzenle</button>
<button onclick="silStok(${i})">Sil</button>
</td>
</tr>`;
});
html+="</table>";
stokList.innerHTML=html;
}

/* CARİ */
function cariEkle(){
cari.push(cariInput.value);
cari.sort();
localStorage.setItem("cari",JSON.stringify(cari));
renderCari();
}

function silCari(i){
if(confirm("Silinsin mi?")){
cari.splice(i,1);
localStorage.setItem("cari",JSON.stringify(cari));
renderCari();
}
}

function duzenleCari(i){
let c=prompt("Cari",cari[i]);
if(c){
cari[i]=c;
localStorage.setItem("cari",JSON.stringify(cari));
renderCari();
}
}

function renderCari(){
let html=`<table>
<tr><th>Cari</th><th>İşlem</th></tr>`;
cari.forEach((c,i)=>{
html+=`<tr>
<td>${c}</td>
<td>
<button onclick="duzenleCari(${i})">Düzenle</button>
<button onclick="silCari(${i})">Sil</button>
</td>
</tr>`;
});
html+="</table>";
cariList.innerHTML=html;
}

/* CAMERA (ARKA KAMERA ZORUNLU) */
function kamera(){
stopCam();
scanner=new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(dev=>{
let back=dev.find(d=>d.label.toLowerCase().includes("back"))||dev[0];

scanner.start(back.id,{fps:10,qrbox:250},(text)=>{
barkod.value=text;
stopCam();
});
});
}

function stopCam(){
if(scanner){
scanner.stop().then(()=>scanner.clear()).catch(()=>{});
scanner=null;
}
}

</script>

</body>
</html>
