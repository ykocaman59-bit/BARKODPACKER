<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER</title>

<style>
body { margin:0; font-family:Arial; background:#2d74da; }
.container { max-width:500px; margin:20px auto; background:#fff; padding:15px; border-radius:12px; }
.hidden { display:none; }

input, button, select {
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button { border:none; cursor:pointer; }
.primary { background:#2d74da; color:#fff; }
.danger { background:red; color:#fff; }

ul { list-style:none; padding:0; }
li { padding:8px; border-bottom:1px solid #ddd; }

.topbar { display:flex; justify-content:space-between; align-items:center; }

.menu button { background:#eee; margin:5px 0; }

.blue {
  background:#2d74da;
  color:white;
  min-height:100vh;
  padding:20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginPage">
  <h2>BARKODPACKER</h2>

  <input id="user" placeholder="Kullanıcı adı">
  <input id="pass" type="password" placeholder="Şifre">

  <select id="firma">
    <option>Firma Seçiniz</option>
    <option>Demo A.Ş</option>
    <option>Test Ltd</option>
  </select>

  <button class="primary" onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="container hidden" id="home">
  <h3>ANA PANEL</h3>

  <div class="menu">
    <button onclick="page('stok')">STOK DETAY</button>
    <button onclick="page('cari')">CARİ</button>
    <button onclick="blue('ALIS İRSALİYE')">ALIŞ</button>
    <button onclick="blue('SATIŞ İRSALİYE')">SATIŞ</button>
    <button onclick="blue('SAYIM FİŞİ')">SAYIM</button>
  </div>
</div>

<!-- STOK -->
<div class="container hidden" id="stok">
  <div class="topbar">
    <button onclick="page('home')">🏠</button>
    <h3>STOK</h3>
  </div>

  <input id="barkod" placeholder="Barkod">
  <input id="urun" placeholder="Ürün adı">

  <button class="primary" onclick="stokEkle()">STOK EKLE</button>
  <button onclick="barkodOku()">📷 Barkod Oku</button>

  <ul id="stokList"></ul>
</div>

<!-- CARİ -->
<div class="container hidden" id="cari">
  <div class="topbar">
    <button onclick="page('home')">🏠</button>
    <h3>CARİ</h3>
  </div>

  <input id="cariInput" placeholder="Cari adı">

  <button class="primary" onclick="cariEkle()">EKLE</button>
  <button class="danger" onclick="cariSil()">SİL</button>

  <ul id="cariList"></ul>
</div>

<!-- MAVİ EKRAN -->
<div class="hidden blue" id="blueScreen">
  <h2 id="blueTitle"></h2>
  <p>Bu ekran demo irsaliye ekranıdır</p>
  <button onclick="page('home')">ANA SAYFA</button>
</div>

<script>

let stok = JSON.parse(localStorage.getItem("stok")||"[]");
let cari = JSON.parse(localStorage.getItem("cari")||"[]");

/* SAVE */
function save(){
  localStorage.setItem("stok",JSON.stringify(stok));
  localStorage.setItem("cari",JSON.stringify(cari));
}

/* LOGIN */
function login(){
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;
  const f = document.getElementById("firma").value;

  if(!u || !p || f === "Firma Seçiniz"){
    alert("Tüm alanları doldur");
    return;
  }

  if(u === "admin" && p === "1234"){
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");
  } else {
    alert("Hatalı giriş");
  }
}

/* PAGE */
function page(id){
  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));
  document.getElementById("blueScreen").classList.add("hidden");

  if(id==="stok") renderStok();
  if(id==="cari") renderCari();

  document.getElementById(id).classList.remove("hidden");
}

/* BLUE SCREEN */
function blue(t){
  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));
  document.getElementById("blueScreen").classList.remove("hidden");
  document.getElementById("blueTitle").innerText = t;
}

/* STOK EKLE */
function stokEkle(){
  const b = document.getElementById("barkod").value;
  const u = document.getElementById("urun").value;

  if(!b || !u) return;

  stok.push({barkod:b, urun:u, adet:0});
  save();
  renderStok();
}

/* BARKOD OKU (simülasyon) */
function barkodOku(){
  const b = prompt("Barkod:");
  const u = prompt("Ürün adı:");
  if(!b || !u) return;

  stok.push({barkod:b, urun:u, adet:0});
  save();
  renderStok();
}

/* STOK GÖSTER */
function renderStok(){
  stokList.innerHTML="";
  stok.forEach(s=>{
    stokList.innerHTML += `<li>${s.barkod} / ${s.urun} / ${s.adet}</li>`;
  });
}

/* CARİ EKLE */
function cariEkle(){
  const c = document.getElementById("cariInput").value;
  if(!c) return;

  cari.push(c);
  cari.sort();
  save();
  renderCari();
}

/* CARİ SİL */
function cariSil(){
  const c = prompt("Silinecek cari adı:");
  if(!c) return;

  if(confirm("Emin misin?")){
    cari = cari.filter(x=>x!==c);
    save();
    renderCari();
  }
}

/* CARİ GÖSTER */
function renderCari(){
  cariList.innerHTML="";
  cari.forEach(c=>{
    cariList.innerHTML += `<li>${c}</li>`;
  });
}

</script>

</body>
</html>
