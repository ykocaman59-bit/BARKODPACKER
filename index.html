<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BARKODPACKER ERP</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary-blue: #4a90e2;
            --secondary-blue: #5cb8d1;
            --danger-red: #ff5e5e;
            --white: #ffffff;
        }

        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; }
        
        /* Navbar */
        .navbar { background: var(--primary-blue); color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .navbar h3 { margin: 0; font-style: italic; }

        .box { padding: 15px; }
        .hidden { display: none; }

        /* Nitrogen Stil Butonlar */
        button {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: none;
            border-radius: 40px; /* Tam Oval */
            background: var(--primary-blue);
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .btn-secondary { background: var(--secondary-blue); }
        .btn-exit { background: var(--danger-red); margin-top: 20px; }
        
        /* Inputlar */
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        /* Liste Tasarımı */
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary-blue); display: flex; justify-content: space-between; align-items: center; }
        
        /* Alış İrsaliyesi Etiketleri */
        .info-panel { background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; color: #333; line-height: 1.6; }
        .info-panel b { color: var(--secondary-blue); }

        /* Kamera Alanı */
        #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th { background: #eee; padding: 10px; font-size: 12px; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
        
        .floating-icon { font-size: 24px; background: none; border: none; color: white; width: auto; box-shadow: none; padding: 0; }
    </style>
</head>
<body>

<div class="navbar" id="navBar">
    <span id="navTitle">Online</span>
    <button class="floating-icon" onclick="goHome()">🏠</button>
    <span id="dots" onclick="toggleMenu()">•••</span>
</div>

<div id="homePage" class="box">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button onclick="openPage('stokPage')">Stok Detay</button>
        <button class="btn-secondary" onclick="alert('Sayım Fişi Hazırlanıyor')">Sayım Fişi</button>
        <button onclick="alert('Depo Sevk Hazırlanıyor')">Deposevk</button>
        <button class="btn-secondary" onclick="alert('Satış Hazırlanıyor')">Satış İrsaliyesi</button>
        <button onclick="openPage('alisPage')">Alış İrsaliyesi</button>
        <button class="btn-secondary" onclick="openPage('cariPage')">Cari</button>
    </div>
    <button class="btn-exit" onclick="location.reload()">Çıkış</button>
    <p style="text-align: center; color: var(--primary-blue); font-weight: bold;">www.teknoerp.com.tr</p>
</div>

<div id="cariPage" class="box hidden">
    <input id="cariName" placeholder="Cari Adı Yazın">
    <button onclick="cariEkle()">EKLE</button>
    <hr>
    <input id="cariAra" placeholder="Cari Ara..." oninput="cariFiltrele()">
    <div id="cariListesi"></div>
</div>

<div id="alisPage" class="box hidden">
    <div class="info-panel">
        <b>Evrak No:</b> <span id="dispEvrakNo">-</span><br>
        <b>Cari:</b> <span id="dispCari">Seçilmedi</span><br>
        <b>Depo:</b> BATTALGAZİ
    </div>
    <div id="alisMenu" class="hidden" style="background:#eee; padding:10px; border-radius:10px; margin-bottom:10px;">
        <button onclick="yeniEvrak()">Yeni Evrak</button>
        <button onclick="openPage('evrakListesiPage')">Evrak Getir</button>
        <button style="background:red" onclick="evrakSil()">Evrak Sil</button>
    </div>
    <button onclick="openPage('belgeNoPage')">Belge Bilgisi</button>
    <button onclick="openPage('cariSecPage')">Cari Seç</button>
    <button onclick="barkodGirisAc()">Barkod Giriş</button>
    <button onclick="openPage('islemSatirlariPage')">İşlem Satırları</button>
</div>

<div id="belgeNoPage" class="box hidden">
    <div style="display: flex; gap: 5px;">
        <input id="belgeSabit" value="ALIŞ-" disabled style="width: 40%;">
        <input id="belgeDinamik" placeholder="No Giriniz" style="width: 60%;">
    </div>
    <button onclick="belgeKaydet()">KAYDET</button>
    <button class="btn-secondary" onclick="openPage('alisPage')">GERİ</button>
</div>

<div id="cariSecPage" class="box hidden">
    <input id="cariSecAra" placeholder="Cari Ara..." oninput="cariFiltreleSec()">
    <div id="cariSecListesi"></div>
    <button class="btn-secondary" onclick="openPage('alisPage')">GERİ</button>
</div>

<div id="barkodGirisPage" class="box hidden">
    <div style="display: flex; gap: 5px; align-items: center;">
        <input id="barcodeInp" placeholder="Barkod Okutun veya Yazın">
        <button onclick="urunBul()" style="width: 80px; border-radius: 8px;">GETİR</button>
        <button onclick="kameraAc()" style="width: 60px; border-radius: 8px;">📷</button>
    </div>
    
    <div id="reader"></div>

    <div id="urunDetay" class="hidden">
        <div class="card" id="urunBilgiText"></div>
        <input id="adetInp" type="number" placeholder="Miktar Girin">
        <button onclick="evragaEkle()">EKLE</button>
    </div>
    
    <button onclick="openPage('islemSatirlariPage')" style="background: #6c757d;">📋 İŞLEM SATIRLARI</button>
    <button class="btn-secondary" onclick="openPage('alisPage')">GERİ</button>
</div>

<div id="islemSatirlariPage" class="box hidden">
    <h3 id="tabloBaslik">İşlem Satırları</h3>
    <table>
        <thead>
            <tr><th>Barkod</th><th>Ürün Adı</th><th>Miktar</th></tr>
        </thead>
        <tbody id="islemTabloGövde"></tbody>
    </table>
    <br>
    <button onclick="barkodGirisAc()">Barkod Girişine Dön</button>
</div>

<div id="evrakListesiPage" class="box hidden">
    <input type="date" id="filterTarih">
    <button onclick="evraklariGetir()">GETİR</button>
    <div id="evrakListesiSonuc"></div>
</div>

<div id="stokPage" class="box hidden">
    <h3>STOK LİSTESİ</h3>
    <div id="stokListesi"></div>
    <button class="btn-secondary" onclick="goHome()">GERİ</button>
</div>

<script>
/* VERİ YAPISI */
let db_stok = JSON.parse(localStorage.getItem("db_stok") || '[{"barkod":"123","ad":"Ülker Çikolata","stok":100},{"barkod":"456","ad":"Ekmek","stok":50}]');
let db_cari = JSON.parse(localStorage.getItem("db_cari") || '["Dilek Gıda","Özlem Market"]');
let db_evraklar = JSON.parse(localStorage.getItem("db_evraklar") || "[]");

let aktifEvrak = { no: "", cari: "", kalemler: [], tarih: "" };
let bulunanUrun = null;
let html5QrCode = null;

/* SAYFA YÖNETİMİ */
function openPage(pageId) {
    document.querySelectorAll('.box').forEach(b => b.classList.add('hidden'));
    document.getElementById(pageId).classList.remove('hidden');
    stopKamera();
    
    if(pageId === 'cariPage') cariFiltrele();
    if(pageId === 'stokPage') stokListele();
}

function goHome() {
    if(aktifEvrak.kalemler.length > 0) evrakOtomatikKaydet();
    openPage('homePage');
}

function toggleMenu() {
    let m = document.getElementById('alisMenu');
    m.classList.toggle('hidden');
}

/* CARİ İŞLEMLERİ */
function cariEkle() {
    let isim = document.getElementById('cariName').value;
    if(!isim) return;
    db_cari.push(isim);
    localStorage.setItem("db_cari", JSON.stringify(db_cari));
    document.getElementById('cariName').value = "";
    cariFiltrele();
}

function cariFiltrele() {
    let ara = document.getElementById('cariAra').value.toLowerCase();
    let liste = db_cari.filter(c => c.toLowerCase().includes(ara)).sort();
    let html = "";
    liste.forEach(c => {
        html += `<div class="card">
            <span>${c}</span>
            <div>
                <button style="width:auto; padding:5px 10px; margin:0; font-size:12px;" onclick="alert('Düzenle: ${c}')">Düzenle</button>
                <button style="width:auto; padding:5px 10px; margin:0; font-size:12px; background:red;" onclick="cariSil('${c}')">Sil</button>
            </div>
        </div>`;
    });
    document.getElementById('cariListesi').innerHTML = html;
}

function cariSil(isim) {
    db_cari = db_cari.filter(c => c !== isim);
    localStorage.setItem("db_cari", JSON.stringify(db_cari));
    cariFiltrele();
}

/* ALIŞ İRSALİYESİ MANTIĞI */
function yeniEvrak() {
    aktifEvrak = { no: "ALIŞ-" + Math.floor(Math.random()*9000+1000), cari: "", kalemler: [], tarih: new Date().toISOString().split('T')[0] };
    document.getElementById('dispEvrakNo').innerText = aktifEvrak.no;
    document.getElementById('dispCari').innerText = "Seçilmedi";
    toggleMenu();
}

function belgeKaydet() {
    let no = document.getElementById('belgeDinamik').value;
    if(!no) { alert("Lütfen numara girin"); return; }
    aktifEvrak.no = "ALIŞ-" + no;
    document.getElementById('dispEvrakNo').innerText = aktifEvrak.no;
    openPage('alisPage');
}

function cariFiltreleSec() {
    let ara = document.getElementById('cariSecAra').value.toLowerCase();
    let liste = db_cari.filter(c => c.toLowerCase().includes(ara));
    let html = "";
    liste.forEach(c => {
        html += `<div class="card" onclick="cariSecildi('${c}')">${c}</div>`;
    });
    document.getElementById('cariSecListesi').innerHTML = html || "Cari Bulunamadı";
}

function cariSecildi(c) {
    aktifEvrak.cari = c;
    document.getElementById('dispCari').innerText = c;
    openPage('alisPage');
}

/* BARKOD GİRİŞİ */
function barkodGirisAc() {
    if(!aktifEvrak.cari) { alert("Cari seçiniz"); return; }
    openPage('barkodGirisPage');
    document.getElementById('urunDetay').classList.add('hidden');
}

function urunBul() {
    let b = document.getElementById('barcodeInp').value;
    let urun = db_stok.find(x => x.barkod == b);
    if(urun) {
        bulunanUrun = urun;
        document.getElementById('urunBilgiText').innerHTML = `<b>${urun.ad}</b> <br> Mevcut Stok: ${urun.stok}`;
        document.getElementById('urunDetay').classList.remove('hidden');
    } else {
        alert("Ürün bulunamadı!");
        document.getElementById('urunDetay').classList.add('hidden');
    }
}

function evragaEkle() {
    let adet = parseInt(document.getElementById('adetInp').value);
    if(!adet || adet <= 0) return;

    // Stok güncelle
    bulunanUrun.stok += adet;
    
    // Evraka ekle
    aktifEvrak.kalemler.push({ barkod: bulunanUrun.barkod, ad: bulunanUrun.ad, miktar: adet });
    
    // Temizle ve Gizle
    localStorage.setItem("db_stok", JSON.stringify(db_stok));
    document.getElementById('barcodeInp').value = "";
    document.getElementById('adetInp').value = "";
    document.getElementById('urunDetay').classList.add('hidden');
    alert("Eklendi");
}

/* İŞLEM SATIRLARI TABLOSU */
function tabloGoster() {
    let html = "";
    aktifEvrak.kalemler.forEach(k => {
        html += `<tr><td>${k.barkod}</td><td>${k.ad}</td><td>${k.miktar}</td></tr>`;
    });
    document.getElementById('islemTabloGövde').innerHTML = html;
}

// Override openPage for table
const originalOpenPage = openPage;
openPage = function(pageId) {
    if(pageId === 'islemSatirlariPage') {
        if(aktifEvrak.kalemler.length === 0) { alert("Daha mal kabule başlamadınız"); return; }
        tabloGoster();
    }
    originalOpenPage(pageId);
}

/* EVRAK YÖNETİMİ */
function evrakOtomatikKaydet() {
    let varmi = db_evraklar.findIndex(e => e.no === aktifEvrak.no);
    if(varmi > -1) db_evraklar[varmi] = JSON.parse(JSON.stringify(aktifEvrak));
    else db_evraklar.push(JSON.parse(JSON.stringify(aktifEvrak)));
    localStorage.setItem("db_evraklar", JSON.stringify(db_evraklar));
}

function evraklariGetir() {
    let tarih = document.getElementById('filterTarih').value;
    let liste = db_evraklar.filter(e => e.tarih === tarih);
    let html = "";
    if(liste.length === 0) { html = "Evrak bulunamadı"; }
    else {
        liste.forEach(e => {
            html += `<div class="card" onclick="evrakYukle('${e.no}')">
                <b>${e.no}</b><br>${e.cari}
            </div>`;
        });
    }
    document.getElementById('evrakListesiSonuc').innerHTML = html;
}

function evrakYukle(no) {
    let e = db_evraklar.find(x => x.no === no);
    aktifEvrak = JSON.parse(JSON.stringify(e));
    document.getElementById('dispEvrakNo').innerText = aktifEvrak.no;
    document.getElementById('dispCari').innerText = aktifEvrak.cari;
    openPage('alisPage');
}

function evrakSil() {
    if(!aktifEvrak.no) return;
    if(!confirm("Bu evrak silinecek ve stoklar geri alınacak. Emin misiniz?")) return;

    // Stokları geri çek
    aktifEvrak.kalemler.forEach(k => {
        let urun = db_stok.find(s => s.barkod == k.barkod);
        if(urun) urun.stok -= k.miktar;
    });

    db_evraklar = db_evraklar.filter(e => e.no !== aktifEvrak.no);
    localStorage.setItem("db_evraklar", JSON.stringify(db_evraklar));
    localStorage.setItem("db_stok", JSON.stringify(db_stok));
    
    alert("Evrak silindi, stok güncellendi.");
    yeniEvrak();
    openPage('alisPage');
}

function stokListele() {
    let html = "<table><thead><tr><th>Ürün</th><th>Stok</th></tr></thead><tbody>";
    db_stok.forEach(s => {
        html += `<tr><td>${s.ad}</td><td><b>${s.stok}</b></td></tr>`;
    });
    html += "</tbody></table>";
    document.getElementById('stokListesi').innerHTML = html;
}

/* KAMERA İŞLEMLERİ */
function kameraAc() {
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
            document.getElementById('barcodeInp').value = decodedText;
            stopKamera();
            urunBul(); // Otomatik getir
        }
    ).catch(err => alert("Kamera hatası: " + err));
}

function stopKamera() {
    if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => html5QrCode.clear());
    }
}

// Başlangıçta evrak oluştur
yeniEvrak();
</script>

</body>
</html>
