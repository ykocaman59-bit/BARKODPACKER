<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { margin:0; font-family:Arial; background:#2d74da; }
.container { max-width:500px; margin:20px auto; background:#fff; padding:15px; border-radius:12px; }
.hidden { display:none; }

button,input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
}

.primary{background:#2d74da;color:#fff;border:0;}
.danger{background:red;color:#fff;border:0;}

ul{list-style:none;padding:0;}
li{padding:8px;border-bottom:1px solid #ddd;}

.topbar{display:flex;justify-content:space-between;}
.blue{background:#2d74da;color:#fff;min-height:100vh;padding:20px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginPage">
  <h2>BARKODPACKER</h2>

  <input id="user" placeholder="Kullanıcı">
  <input id="pass" type="password" placeholder="Şifre">

  <select id="firma">
    <option>Firma Seçiniz</option>
    <option>Demo A.Ş</option>
  </select>

  <button class="primary" onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="container hidden" id="home">
  <h3>ANA SAYFA</h3>

  <button onclick="page('stok')">STOK DETAY</button>
  <button onclick="page('cari')">CARİ</button>
  <button onclick="page('alis')">ALIŞ İRSALİYE</button>
  <button onclick="page('satis')">SATIŞ İRSALİYE</button>
  <button onclick="page('sayim')">SAYIM FİŞİ</button>
</div>

<!-- STOK -->
<div class="container hidden" id="stok">
  <div class="topbar">
    <button onclick="home()">🏠</button>
    <h3>STOK</h3>
  </div>

  <input id="barkod">
  <input id="urun">

  <button class="primary" onclick="stokEkle()">EKLE</button>
  <button onclick="openScanner()">📷 OKU</button>

  <div id="reader"></div>

  <ul id="stokList"></ul>
</div>

<!-- CARİ -->
<div class="container hidden" id="cari">
  <div class="topbar">
    <button onclick="home()">🏠</button>
    <h3>CARİ</h3>
  </div>

  <input id="cariInput">
  <button class="primary" onclick="cariEkle()">EKLE</button>

  <ul id="cariList"></ul>
</div>

<!-- BLUE IRSA -->
<div class="container hidden blue" id="irsaliye">
  <h2 id="irsTitle"></h2>
  <button onclick="home()">ANA SAYFA</button>
</div>

<script>

let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let cari=JSON.parse(localStorage.getItem("cari")||"[]");
let scanner=null;

/* SAVE */
function save(){
  localStorage.setItem("stok",JSON.stringify(stok));
  localStorage.setItem("cari",JSON.stringify(cari));
}

/* LOGIN */
function login(){
  let u=user.value,p=pass.value,f=firma.value;
  if(u==="admin"&&p==="1234"&&f!=="Firma Seçiniz"){
    loginPage.classList.add("hidden");
    home.classList.remove("hidden");
  }
}

/* PAGE */
function page(id){
  stopScanner();

  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));

  if(id==="stok") renderStok();
  if(id==="cari") renderCari();
  if(id==="alis"||id==="satis"||id==="sayim"){
    irsaliye.classList.remove("hidden");
    irsTitle.innerText=id.toUpperCase();
    return;
  }

  document.getElementById(id).classList.remove("hidden");
}

/* HOME RESET */
function home(){
  stopScanner();
  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));
  home.classList.remove("hidden");
}

/* STOP SCANNER (ÇOK ÖNEMLİ FIX) */
function stopScanner(){
  if(scanner){
    scanner.stop().then(()=>scanner.clear()).catch(()=>{});
    scanner=null;
  }
}

/* SCANNER */
function openScanner(){
  stopScanner();

  scanner=new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices=>{
    if(devices.length){
      scanner.start(
        devices[0].id,
        {fps:10,qrbox:250},
        (text)=>{
          barkod.value=text;
          stopScanner();
        }
      );
    }
  });
}

/* STOK */
function stokEkle(){
  if(!barkod.value||!urun.value) return;
  stok.push({barkod:barkod.value,urun:urun.value,adet:0});
  save();
  renderStok();
}

function renderStok(){
  stokList.innerHTML="";
  stok.forEach(s=>{
    stokList.innerHTML+=`<li>${s.barkod} / ${s.urun} / ${s.adet}</li>`;
  });
}

/* CARİ */
function cariEkle(){
  if(!cariInput.value) return;
  cari.push(cariInput.value);
  cari.sort();
  save();
  renderCari();
}

function renderCari(){
  cariList.innerHTML="";
  cari.forEach(c=>{
    cariList.innerHTML+=`<li>${c}</li>`;
  });
}

</script>

</body>
</html>
