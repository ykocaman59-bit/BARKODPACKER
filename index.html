<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.box{max-width:520px;margin:20px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}

input,button{
width:100%;
padding:10px;
margin:5px 0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.top{display:flex;justify-content:space-between;}

.labelBox{
background:#eee;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}

.bottomExit{
position:fixed;
bottom:80px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
padding:12px 25px;
border-radius:10px;
border:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
<h2>BARKODPACKER</h2>

<input id="user" placeholder="Kullanıcı">
<input id="pass" type="password" placeholder="Şifre">

<select id="firma">
<option>Firma Seçiniz</option>
<option>Demo</option>
</select>

<button onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">

<h3 style="text-align:center;">ANA SAYFA</h3>

<table>
<tr>
<td><button onclick="openPage('stok')">STOK</button></td>
<td><button onclick="openPage('sayim')">SAYIM</button></td>
</tr>
<tr>
<td><button onclick="openPage('alis')">ALIŞ</button></td>
<td><button onclick="openPage('satis')">SATIŞ</button></td>
</tr>
<tr>
<td colspan="2"><button onclick="openPage('cari')">CARİ</button></td>
</tr>
</table>

<button class="bottomExit" onclick="logout()">ÇIKIŞ</button>
</div>

<!-- ALIŞ -->
<div class="box hidden" id="alis">

<div class="top">
<button onclick="home()">🏠</button>
<button onclick="cariSecAc()">☰</button>
</div>

<div class="labelBox">
<b>Belge No:</b> <span id="labelBelge">-</span><br>
<b>Cari:</b> <span id="labelCari">Cari adı (işyeri ünvanı)</span>
</div>

<input value="BARKODPACKER-PDA" disabled>

<button onclick="belgeAc()">BELGE NO</button>
<button onclick="barkodAc()">BARKOD GİRİŞ</button>

</div>

<!-- BELGE -->
<div class="box hidden" id="belgePage">
<button onclick="geriAlis()">⬅</button>

<h3>Belge No</h3>

<label>Kilitli Belge No</label>
<input id="belge1">

<label>Alternatif No</label>
<input id="belge2">

<button onclick="belgeKaydet()">KAYDET</button>
</div>

<!-- CARİ SEÇ -->
<div class="box hidden" id="cariSec">
<button onclick="geriAlis()">⬅</button>

<h3>Cari Seç</h3>

<input id="cariSearch2" placeholder="Ara">
<button onclick="cariFiltre2()">Filtrele</button>

<div id="cariSecList"></div>

<button onclick="cariSecOnay()">SEÇ</button>
</div>

<!-- BARKOD -->
<div class="box hidden" id="barkodPage">
<button onclick="geriAlis()">⬅</button>

<h3>BARKOD</h3>

<input id="barkodInput">
<button onclick="urunGetir()">GETİR</button>

<button onclick="kamera()">📷 OKU</button>

<div id="reader"></div>

<div id="urunInfo"></div>

<input id="adet" type="number" placeholder="Adet">
<button onclick="ekle()">EKLE</button>
</div>

<script>

/* DATA */
let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let cari=JSON.parse(localStorage.getItem("cari")||"[]");

let aktifUrun=null;
let scanner=null;

let belgeNo="";
let cariSecili="";
let secilenCariTemp="";

/* LOGIN */
function login(){
if(user.value==="admin" && pass.value==="1234" && firma.value!=="Firma Seçiniz"){
loginPage.classList.add("hidden");
homePage.classList.remove("hidden");
}
}

function logout(){location.reload();}

/* NAV */
function openPage(id){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

/* HOME */
function home(){
openPage("homePage");
}

/* BELGE */
function belgeAc(){
openPage("belgePage");
}

function belgeKaydet(){

if(belge1.value){
belgeNo=belge1.value;
}else if(belge2.value){
belgeNo=belge2.value;
}

labelBelge.innerText=belgeNo || "-";

geriAlis();
}

/* CARİ */
function cariSecAc(){
openPage("cariSec");
cariFiltre2();
}

function cariFiltre2(){

let v=cariSearch2.value.toLowerCase();
let liste=cari.filter(c=>c.toLowerCase().includes(v));
liste.sort();

let html="<table>";

liste.forEach(c=>{
html+=`<tr onclick="sec('${c}')"><td>${c}</td></tr>`;
});

html+="</table>";

cariSecList.innerHTML=html;
}

function sec(c){
secilenCariTemp=c;
}

function cariSecOnay(){

if(!secilenCariTemp){
alert("Firma seçiniz");
return;
}

cariSecili=secilenCariTemp;
labelCari.innerText=cariSecili;

geriAlis();
}

/* BARKOD */
function barkodAc(){

if(!cariSecili){
alert("Firma seçiniz");
return;
}

openPage("barkodPage");
}

function urunGetir(){

let urun=stok.find(x=>x.barkod==barkodInput.value);

if(!urun){
alert("Ürün yok");
return;
}

aktifUrun=urun;

urunInfo.innerHTML=`${urun.urun} / Stok: ${urun.adet}`;
}

/* EKLE */
function ekle(){

if(!aktifUrun || !adet.value) return;

aktifUrun.adet+=Number(adet.value);

localStorage.setItem("stok",JSON.stringify(stok));

aktifUrun=null;
barkodInput.value="";
adet.value="";
urunInfo.innerHTML="";

alert("Eklendi");
}

/* CAMERA */
function kamera(){
stopCam();
scanner=new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(dev=>{
let cam=dev.find(d=>d.label.toLowerCase().includes("back"))||dev[0];

scanner.start(cam.id,{fps:10,qrbox:250},(text)=>{
barkodInput.value=text;
stopCam();
});
});
}

function stopCam(){
if(scanner){
scanner.stop().then(()=>scanner.clear()).catch(()=>{});
scanner=null;
}
}

/* GERİ */
function geriAlis(){
openPage("alis");
}

</script>

</body>
</html>
