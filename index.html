<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.box{max-width:520px;margin:20px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}
input,button,select{width:100%;padding:10px;margin:5px 0;}
.primary{background:#2d74da;color:#fff;border:0;}
.danger{background:red;color:#fff;border:0;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
td,th{border:1px solid #ddd;padding:8px;text-align:center;}
.top{display:flex;justify-content:space-between;}
.bottomExit{
position:fixed;
bottom:60px;
left:50%;
transform:translateX(-50%);
background:red;
color:#fff;
padding:12px 25px;
border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
<h2>BARKODPACKER</h2>
<input id="user" placeholder="admin">
<input id="pass" type="password" placeholder="1234">
<select id="firma">
<option>Firma Seçiniz</option>
<option>Demo</option>
</select>
<button class="primary" onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">

<h3 style="text-align:center;">ANA SAYFA</h3>

<table>
<tr>
<td><button onclick="openPage('stok')">STOK DETAY</button></td>
<td><button onclick="openPage('sayim')">SAYIM FİŞİ</button></td>
</tr>
<tr>
<td><button onclick="openPage('alis')">ALIŞ İRSALİYE</button></td>
<td><button onclick="openPage('satis')">SATIŞ İRSALİYE</button></td>
</tr>
<tr>
<td colspan="2"><button onclick="openPage('cari')">CARİ</button></td>
</tr>
</table>

<button class="bottomExit" onclick="logout()">ÇIKIŞ</button>
</div>

<!-- STOK -->
<div class="box hidden" id="stok">
<div class="top">
<button onclick="home()">🏠</button>
<h3>STOK</h3>
</div>

<input id="stokBarkod" placeholder="Barkod">
<input id="stokUrun" placeholder="Ürün">
<button onclick="stokEkle()">EKLE</button>

<button onclick="kamera()">📷 OKU</button>
<div id="reader"></div>

<div id="stokList"></div>
</div>

<!-- CARİ -->
<div class="box hidden" id="cari">
<div class="top">
<button onclick="home()">🏠</button>
<h3>CARİ</h3>
</div>

<input id="cariInput">
<button onclick="cariEkle()">EKLE</button>

<div id="cariList"></div>
</div>

<!-- SAYIM -->
<div class="box hidden" id="sayim">
<div class="top">
<button onclick="home()">🏠</button>
<h3>SAYIM FİŞİ</h3>
</div>
<p>Hazır (ileride dolduracağız)</p>
</div>

<!-- SATIŞ -->
<div class="box hidden" id="satis">
<div class="top">
<button onclick="home()">🏠</button>
<h3>SATIŞ İRSALİYE</h3>
</div>
<p>Hazır (ileride dolduracağız)</p>
</div>

<!-- ALIŞ -->
<div class="box hidden" id="alis">

<div class="top">
<button onclick="home()">🏠</button>
<h3>ALIŞ İRSALİYE</h3>
</div>

<label>Belge No</label>
<input value="PDA" disabled>
<input id="belgeNo">

<label>Cari</label>
<select id="cariSelect"></select>

<button onclick="barkodAc()">BARKOD GİRİŞ</button>

</div>

<!-- BARKOD -->
<div class="box hidden" id="barkodPage">

<div class="top">
<button onclick="geri()">⬅</button>
<button onclick="toggleListe()">📒 / 📷</button>
</div>

<h3>BARKOD</h3>

<input id="barkodInput">
<button onclick="urunGetir()">GETİR</button>

<button onclick="kamera()">📷 OKU</button>

<div id="reader"></div>

<div id="urunInfo"></div>

<input id="adet" type="number" placeholder="Adet">
<button onclick="ekle()">EKLE</button>

<div id="liste"></div>

</div>

<script>

let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let cari=JSON.parse(localStorage.getItem("cari")||"[]");
let alis=JSON.parse(localStorage.getItem("alis")||"[]");

let aktifUrun=null;
let listeAcik=false;
let scanner=null;

/* LOGIN */
function login(){
if(user.value==="admin" && pass.value==="1234"){
loginPage.classList.add("hidden");
homePage.classList.remove("hidden");
}
}

/* NAV */
function openPage(id){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");

if(id==="stok") renderStok();
if(id==="cari") renderCari();
if(id==="alis") initAlis();
}

function home(){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
homePage.classList.remove("hidden");
}

function logout(){
location.reload();
}

/* STOK */
function stokEkle(){
stok.push({barkod:stokBarkod.value,urun:stokUrun.value,adet:0});
localStorage.setItem("stok",JSON.stringify(stok));
renderStok();
}

function renderStok(){
let html="<table><tr><th>Barkod</th><th>Ürün</th><th>Adet</th></tr>";
stok.forEach(s=>{
html+=`<tr><td>${s.barkod}</td><td>${s.urun}</td><td>${s.adet}</td></tr>`;
});
html+="</table>";
stokList.innerHTML=html;
}

/* CARİ */
function cariEkle(){
cari.push(cariInput.value);
cari.sort();
localStorage.setItem("cari",JSON.stringify(cari));
renderCari();
}

function renderCari(){
let html="<table><tr><th>Cari</th></tr>";
cari.forEach(c=>{
html+=`<tr><td>${c}</td></tr>`;
});
html+="</table>";
cariList.innerHTML=html;
}

/* ALIŞ */
function initAlis(){
belgeNo.value="ALIS-"+Date.now();
cariSelect.innerHTML="";
cari.forEach(c=>{
cariSelect.innerHTML+=`<option>${c}</option>`;
});
}

function barkodAc(){
if(!cariSelect.value){
alert("Cari seç!");
return;
}
openBarkod();
}

function openBarkod(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
barkodPage.classList.remove("hidden");
}

/* ÜRÜN */
function urunGetir(){
let urun=stok.find(x=>x.barkod==barkodInput.value);

if(!urun){
alert("Ürün yok");
return;
}

aktifUrun=urun;

urunInfo.innerHTML=`Ürün: ${urun.urun}<br>Stok: ${urun.adet}`;
}

/* EKLE */
function ekle(){
if(!aktifUrun) return;

let a=Number(adet.value);

aktifUrun.adet+=a;

alis.push({
belge:belgeNo.value,
urun:aktifUrun.urun,
adet:a
});

localStorage.setItem("stok",JSON.stringify(stok));
localStorage.setItem("alis",JSON.stringify(alis));

urunInfo.innerHTML="Eklendi!";
}

/* LİSTE */
function toggleListe(){
listeAcik=!listeAcik;
if(listeAcik) renderListe();
else liste.innerHTML="";
}

function renderListe(){
let l=alis.filter(x=>x.belge==belgeNo.value);

let html="<table><tr><th>#</th><th>Ürün</th><th>Adet</th></tr>";

l.forEach((x,i)=>{
html+=`<tr><td>${i+1}</td><td>${x.urun}</td><td>${x.adet}</td></tr>`;
});

html+="</table>";

liste.innerHTML=html;
}

/* CAMERA */
function kamera(){
stopCam();
scanner=new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(dev=>{
let cam=dev.find(d=>d.label.toLowerCase().includes("back"))||dev[0];

scanner.start(cam.id,{fps:10,qrbox:250},(text)=>{
barkodInput.value=text;
stopCam();
});
});
}

function stopCam(){
if(scanner){
scanner.stop().then(()=>scanner.clear()).catch(()=>{});
scanner=null;
}
}

/* GERİ */
function geri(){
openPage("alis");
}

</script>

</body>
</html>
