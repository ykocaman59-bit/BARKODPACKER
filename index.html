<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { margin:0; font-family:Arial; background:#2d74da; }
.container { max-width:500px; margin:20px auto; background:#fff; padding:15px; border-radius:12px; }
.hidden { display:none; }

input, button, select {
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
}

button { border:0; cursor:pointer; }
.primary { background:#2d74da; color:#fff; }
.danger { background:red; color:#fff; }

ul { list-style:none; padding:0; }
li { padding:8px; border-bottom:1px solid #ddd; }

.topbar { display:flex; justify-content:space-between; }
.blue { background:#2d74da; color:#fff; min-height:100vh; padding:20px; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginPage">
  <h2>BARKODPACKER</h2>

  <input id="user" placeholder="Kullanıcı">
  <input id="pass" type="password" placeholder="Şifre">

  <select id="firma">
    <option>Firma Seçiniz</option>
    <option>Demo A.Ş</option>
  </select>

  <button class="primary" onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="container hidden" id="home">
  <h3>ANA PANEL</h3>

  <button onclick="page('stok')">STOK DETAY</button>
  <button onclick="page('cari')">CARİ</button>
</div>

<!-- STOK -->
<div class="container hidden" id="stok">
  <div class="topbar">
    <button onclick="page('home')">🏠</button>
    <h3>STOK</h3>
  </div>

  <input id="barkod" placeholder="Barkod">
  <input id="urun" placeholder="Ürün adı">

  <button class="primary" onclick="stokEkle()">STOK EKLE</button>
  <button onclick="openScanner()">📷 Barkod Oku</button>

  <div id="reader" style="width:100%"></div>

  <ul id="stokList"></ul>
</div>

<!-- CARİ -->
<div class="container hidden" id="cari">
  <div class="topbar">
    <button onclick="page('home')">🏠</button>
    <h3>CARİ</h3>
  </div>

  <input id="cariInput" placeholder="Cari adı">

  <button class="primary" onclick="cariEkle()">EKLE</button>

  <ul id="cariList"></ul>
</div>

<script>

let stok = JSON.parse(localStorage.getItem("stok")||"[]");
let cari = JSON.parse(localStorage.getItem("cari")||"[]");

/* SAVE */
function save(){
  localStorage.setItem("stok",JSON.stringify(stok));
  localStorage.setItem("cari",JSON.stringify(cari));
}

/* LOGIN */
function login(){
  const u=user.value,p=pass.value,f=firma.value;
  if(u==="admin" && p==="1234" && f!=="Firma Seçiniz"){
    loginPage.classList.add("hidden");
    home.classList.remove("hidden");
  } else alert("Hatalı giriş");
}

/* PAGE */
function page(id){
  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  if(id==="stok") renderStok();
  if(id==="cari") renderCari();
}

/* STOK EKLE */
function stokEkle(){
  let b=barkod.value,u=urun.value;
  if(!b||!u) return;

  stok.push({barkod:b,urun:u,adet:0});
  save();
  renderStok();
}

/* SİL */
function sil(i){
  if(confirm("Silinsin mi?")){
    stok.splice(i,1);
    save();
    renderStok();
  }
}

/* DÜZENLE */
function duzenle(i){
  let b=prompt("Barkod:",stok[i].barkod);
  let u=prompt("Ürün:",stok[i].urun);

  if(b&&u){
    stok[i].barkod=b;
    stok[i].urun=u;
    save();
    renderStok();
  }
}

/* STOK LİSTE */
function renderStok(){
  stokList.innerHTML="";
  stok.forEach((s,i)=>{
    stokList.innerHTML+=`
      <li>
        ${s.barkod} / ${s.urun} / ${s.adet}
        <button onclick="duzenle(${i})">Düzenle</button>
        <button class="danger" onclick="sil(${i})">Sil</button>
      </li>`;
  });
}

/* CARİ EKLE */
function cariEkle(){
  let c=cariInput.value;
  if(!c) return;

  cari.push(c);
  cari.sort();
  save();
  renderCari();
}

/* CARİ SİL + DÜZENLE */
function cariSil(i){
  if(confirm("Silinsin mi?")){
    cari.splice(i,1);
    save();
    renderCari();
  }
}

function cariDuzenle(i){
  let c=prompt("Cari adı:",cari[i]);
  if(c){
    cari[i]=c;
    save();
    renderCari();
  }
}

function renderCari(){
  cariList.innerHTML="";
  cari.forEach((c,i)=>{
    cariList.innerHTML+=`
      <li>
        ${c}
        <button onclick="cariDuzenle(${i})">Düzenle</button>
        <button class="danger" onclick="cariSil(${i})">Sil</button>
      </li>`;
  });
}

/* BARCODE SCANNER */
function openScanner(){
  const scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices=>{
    if(devices.length){
      scanner.start(
        devices[0].id,
        {fps:10, qrbox:250},
        (text)=>{
          barkod.value = text;
          scanner.stop();
        }
      );
    }
  });
}

</script>

</body>
</html>
