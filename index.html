<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.container{max-width:500px;margin:20px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}
button,input,select{width:100%;padding:10px;margin:5px 0;}
.primary{background:#2d74da;color:#fff;border:0;}
.danger{background:red;color:#fff;border:0;}
ul{list-style:none;padding:0;}
li{padding:8px;border-bottom:1px solid #ddd;}
.topbar{display:flex;justify-content:space-between;}
.blue{background:#2d74da;color:#fff;min-height:100vh;padding:20px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginPage">
  <h2>BARKODPACKER</h2>
  <input id="user">
  <input id="pass" type="password">
  <select id="firma">
    <option>Firma Seçiniz</option>
    <option>Demo A.Ş</option>
  </select>
  <button class="primary" onclick="doLogin()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="container hidden" id="homePage">
  <h3>ANA SAYFA</h3>

  <button onclick="openPage('stokPage')">STOK</button>
  <button onclick="openPage('cariPage')">CARİ</button>
  <button onclick="openBlue('ALIŞ İRSALİYE')">ALIŞ</button>
  <button onclick="openBlue('SATIŞ İRSALİYE')">SATIŞ</button>
  <button onclick="openBlue('SAYIM FİŞİ')">SAYIM</button>
</div>

<!-- STOK -->
<div class="container hidden" id="stokPage">
  <div class="topbar">
    <button onclick="goHome()">🏠</button>
    <h3>STOK</h3>
  </div>

  <input id="barkod">
  <input id="urun">

  <button class="primary" onclick="addStock()">EKLE</button>
  <button onclick="scan()">📷 OKU</button>

  <div id="reader"></div>

  <ul id="stokList"></ul>
</div>

<!-- CARİ -->
<div class="container hidden" id="cariPage">
  <div class="topbar">
    <button onclick="goHome()">🏠</button>
    <h3>CARİ</h3>
  </div>

  <input id="cariInput">
  <button class="primary" onclick="addCari()">EKLE</button>

  <ul id="cariList"></ul>
</div>

<!-- BLUE SCREEN -->
<div class="container hidden blue" id="bluePage">
  <h2 id="blueTitle"></h2>
  <button onclick="goHome()">ANA SAYFA</button>
</div>

<script>

let stok = JSON.parse(localStorage.getItem("stok")||"[]");
let cari = JSON.parse(localStorage.getItem("cari")||"[]");
let scanner=null;

/* SAVE */
function save(){
  localStorage.setItem("stok",JSON.stringify(stok));
  localStorage.setItem("cari",JSON.stringify(cari));
}

/* LOGIN */
function doLogin(){
  let u=user.value,p=pass.value,f=firma.value;

  if(u==="admin"&&p==="1234"&&f!=="Firma Seçiniz"){
    loginPage.classList.add("hidden");
    homePage.classList.remove("hidden");
  } else alert("Hatalı giriş");
}

/* PAGE CONTROL */
function openPage(id){
  stopScan();

  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  if(id==="stokPage") renderStock();
  if(id==="cariPage") renderCari();
}

/* HOME */
function goHome(){
  stopScan();

  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));
  homePage.classList.remove("hidden");
}

/* BLUE SCREEN */
function openBlue(title){
  stopScan();

  document.querySelectorAll(".container").forEach(e=>e.classList.add("hidden"));
  bluePage.classList.remove("hidden");
  blueTitle.innerText=title;
}

/* STOCK */
function addStock(){
  if(!barkod.value||!urun.value) return;

  stok.push({barkod:barkod.value,urun:urun.value,adet:0});
  save();
  renderStock();
}

function renderStock(){
  stokList.innerHTML="";
  stok.forEach(s=>{
    stokList.innerHTML+=`<li>${s.barkod} / ${s.urun} / ${s.adet}</li>`;
  });
}

/* CARİ */
function addCari(){
  if(!cariInput.value) return;

  cari.push(cariInput.value);
  cari.sort();
  save();
  renderCari();
}

function renderCari(){
  cariList.innerHTML="";
  cari.forEach(c=>{
    cariList.innerHTML+=`<li>${c}</li>`;
  });
}

/* CAMERA FIX */
function scan(){
  stopScan();

  scanner=new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices=>{
    scanner.start(
      devices[0].id,
      {fps:10,qrbox:250},
      (text)=>{
        barkod.value=text;
        stopScan();
      }
    );
  });
}

/* STOP CAMERA (KRİTİK) */
function stopScan(){
  if(scanner){
    scanner.stop().then(()=>scanner.clear()).catch(()=>{});
    scanner=null;
  }
}

</script>

</body>
</html>
