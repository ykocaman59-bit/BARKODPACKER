<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER ERP</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.box{max-width:520px;margin:15px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}

input,button,select{
width:100%;
padding:10px;
margin:5px 0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.top{display:flex;justify-content:space-between;}

.exit{
position:fixed;
bottom:70px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
padding:12px 25px;
border:none;
border-radius:10px;
}

.camClose{
background:black;
color:white;
padding:10px;
border:none;
margin-top:5px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
<h2>BARKODPACKER</h2>
<input id="user">
<input id="pass" type="password">
<select id="firma">
<option>Firma Seçiniz</option>
<option>Demo</option>
<option>Test LTD</option>
</select>
<button onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">
<h3 style="text-align:center;">ANA SAYFA</h3>

<table>
<tr>
<td><button onclick="openPage('stok')">STOK</button></td>
<td><button onclick="openPage('sayim')">SAYIM</button></td>
</tr>
<tr>
<td><button onclick="openPage('alis')">ALIŞ</button></td>
<td><button onclick="openPage('satis')">SATIŞ</button></td>
</tr>
<tr>
<td colspan="2"><button onclick="openPage('cari')">CARİ</button></td>
</tr>
</table>

<button class="exit" onclick="logout()">ÇIKIŞ</button>
</div>

<!-- STOK -->
<div class="box hidden" id="stok">
<div class="top"><button onclick="home()">🏠</button><h3>STOK</h3></div>

<input id="stokBarkod">
<input id="stokUrun">
<button onclick="stokEkle()">EKLE</button>

<div id="stokList"></div>
</div>

<!-- CARİ -->
<div class="box hidden" id="cari">
<div class="top"><button onclick="home()">🏠</button><h3>CARİ</h3></div>

<input id="cariInput">
<button onclick="cariEkle()">EKLE</button>

<input id="cariSearch">
<button onclick="cariFiltre()">FİLTRE</button>

<div id="cariList"></div>
</div>

<!-- ALIŞ -->
<div class="box hidden" id="alis">
<div class="top"><button onclick="home()">🏠</button><h3>ALIŞ</h3></div>

<div>
<b>Belge:</b> <span id="labelBelge">ALIŞ-</span><br>
<b>Cari:</b> <span id="labelCari">Seçilmedi</span>
</div>

<input value="BARKODPACKER-PDA" disabled>

<button onclick="belgePage()">BELGE NO</button>
<button onclick="cariSecAc()">CARİ SEÇ</button>
<button onclick="barkodAc()">BARKOD GİRİŞ</button>
</div>

<!-- BELGE -->
<div class="box hidden" id="belgePage">
<button onclick="geriAlis()">⬅</button>

<h3>Belge No</h3>

<input id="belge1" placeholder="ALIS- otomatik">
<input id="belge2" placeholder="Serbest">

<button onclick="belgeKaydet()">KAYDET</button>
</div>

<!-- CARİ SEÇ -->
<div class="box hidden" id="cariSec">
<button onclick="geriAlis()">⬅</button>

<input id="cariSearch2">
<button onclick="cariFiltre2()">Filtrele</button>

<div id="cariSecList"></div>
</div>

<!-- BARKOD -->
<div class="box hidden" id="barkodPage">

<div class="top"><button onclick="geriAlis()">⬅</button></div>

<input id="barkodInput">
<button onclick="urunGetir()">GETİR</button>

<button onclick="kamera()">📷 OKU</button>

<div id="reader"></div>
<button class="camClose hidden" id="camCloseBtn" onclick="stopCam()">KAMERAYI KAPAT</button>

<div id="urunInfo"></div>

<input id="adet" type="number">
<button onclick="ekle()">EKLE</button>

</div>

<script>

let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let cari=JSON.parse(localStorage.getItem("cari")||"[]");
let alis=JSON.parse(localStorage.getItem("alis")||"[]");

let aktif=null;
let cam=null;

let belgeNo="ALIŞ-";
let cariSecili="";

/* LOGIN */
function login(){
if(user.value==="admin" && pass.value==="1234"){
loginPage.classList.add("hidden");
homePage.classList.remove("hidden");
}
}

function logout(){location.reload();}

/* NAV */
function openPage(id){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");

if(id==="stok") renderStok();
if(id==="cari") renderCari();

if(id==="alis"){
document.getElementById("labelBelge").innerText = belgeNo;
document.getElementById("labelCari").innerText = cariSecili || "Seçilmedi";
}
}

function home(){
stopCam();
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
homePage.classList.remove("hidden");
}

/* STOK */
function stokEkle(){
stok.push({barkod:stokBarkod.value,urun:stokUrun.value,adet:0});
localStorage.setItem("stok",JSON.stringify(stok));
}

/* CARİ */
function cariEkle(){
cari.push(cariInput.value);
cari.sort();
localStorage.setItem("cari",JSON.stringify(cari));
}

function cariFiltre(){
let v=cariSearch.value.toLowerCase();
let f=cari.filter(x=>x.toLowerCase().includes(v));

cariList.innerHTML=f.map((c,i)=>
`<tr>
<td>${c}</td>
<td>
<button onclick="secCari('${c}')">SEÇ</button>
<button onclick="cariSil(${i})">SİL</button>
<button onclick="cariDuzenle(${i})">DÜZ</button>
</td>
</tr>`).join("");
}

function secCari(c){
cariSecili=c;
document.getElementById("labelCari").innerText=c;
geriAlis();
}

function cariSil(i){
if(confirm("Silinsin mi?")){
cari.splice(i,1);
localStorage.setItem("cari",JSON.stringify(cari));
cariFiltre();
}
}

function cariDuzenle(i){
let y=prompt("Cari",cari[i]);
if(y){
cari[i]=y;
localStorage.setItem("cari",JSON.stringify(cari));
}
}

/* BELGE */
function belgePage(){
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
document.getElementById("belgePage").classList.remove("hidden");
belge1.value=belgeNo.replace("ALIŞ-","");
}

function belgeKaydet(){
belgeNo="ALIŞ-"+(belge1.value || Date.now());
document.getElementById("labelBelge").innerText=belgeNo;
geriAlis();
}

/* BARKOD */
function barkodAc(){
if(!cariSecili){alert("Cari seç");return;}
document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
barkodPage.classList.remove("hidden");
}

/* CAMERA FIX */
function kamera(){
cam=new Html5Qrcode("reader");
document.getElementById("camCloseBtn").classList.remove("hidden");

Html5Qrcode.getCameras().then(dev=>{
let back=dev[0];

cam.start(back.id,{fps:10,qrbox:250},txt=>{
barkodInput.value=txt;
stopCam();
});
});
}

function stopCam(){
if(cam){
cam.stop().then(()=>cam.clear());
cam=null;
}
document.getElementById("camCloseBtn").classList.add("hidden");
}

function geriAlis(){openPage("alis");}

</script>
</body>
</html>
