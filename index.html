<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER ERP</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#2d74da;}
.box{max-width:500px;margin:20px auto;background:#fff;padding:15px;border-radius:12px;}
.hidden{display:none;}
button,input,select{width:100%;padding:10px;margin:5px 0;}
.primary{background:#2d74da;color:#fff;border:0;}
.danger{background:red;color:#fff;border:0;}
.top{display:flex;justify-content:space-between;}
.blue{background:#2d74da;color:#fff;min-height:100vh;padding:20px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginPage">
  <h2>BARKODPACKER</h2>

  <input id="user">
  <input id="pass" type="password">

  <select id="firma">
    <option>Firma Seçiniz</option>
    <option>Demo A.Ş</option>
    <option>Test Ltd</option>
  </select>

  <button class="primary" onclick="login()">GİRİŞ</button>
</div>

<!-- HOME -->
<div class="box hidden" id="homePage">
  <div class="top">
    <h3>ANA SAYFA</h3>
    <button class="danger" onclick="logout()">ÇIKIŞ</button>
  </div>

  <button onclick="openPage('stokPage')">STOK DETAY</button>
  <button onclick="openPage('cariPage')">CARİ</button>
  <button onclick="openPage('alisPage')">ALIŞ İRSALİYE</button>
  <button onclick="openPage('satisPage')">SATIŞ İRSALİYE</button>
  <button onclick="openPage('sayimPage')">SAYIM FİŞİ</button>
</div>

<!-- STOK -->
<div class="box hidden" id="stokPage">
  <div class="top">
    <button onclick="home()">🏠</button>
    <h3>STOK</h3>
  </div>

  <input id="barkod">
  <input id="urun">

  <button class="primary" onclick="stokEkle()">EKLE</button>
  <button onclick="kamera()">📷 OKU</button>

  <div id="reader"></div>

  <ul id="stokList"></ul>
</div>

<!-- CARİ -->
<div class="box hidden" id="cariPage">
  <div class="top">
    <button onclick="home()">🏠</button>
    <h3>CARİ</h3>
  </div>

  <input id="cariInput">
  <button class="primary" onclick="cariEkle()">EKLE</button>

  <ul id="cariList"></ul>
</div>

<!-- DOCUMENT PAGES -->
<div class="box hidden blue" id="alisPage">
  <h2>ALIŞ İRSALİYE</h2>
  <button onclick="home()">ANA SAYFA</button>
</div>

<div class="box hidden blue" id="satisPage">
  <h2>SATIŞ İRSALİYE</h2>
  <button onclick="home()">ANA SAYFA</button>
</div>

<div class="box hidden blue" id="sayimPage">
  <h2>SAYIM FİŞİ</h2>
  <button onclick="home()">ANA SAYFA</button>
</div>

<script>

let stok=JSON.parse(localStorage.getItem("stok")||"[]");
let cari=JSON.parse(localStorage.getItem("cari")||"[]");
let scanner=null;

/* LOGIN */
function login(){
  if(user.value==="admin" && pass.value==="1234" && firma.value!=="Firma Seçiniz"){
    loginPage.classList.add("hidden");
    homePage.classList.remove("hidden");
  }
}

/* LOGOUT */
function logout(){
  stopCam();
  document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
  loginPage.classList.remove("hidden");
}

/* NAVIGATION (KRİTİK CORE) */
function openPage(id){
  stopCam();
  document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  if(id==="stokPage") renderStok();
  if(id==="cariPage") renderCari();
}

function home(){
  stopCam();
  document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
  homePage.classList.remove("hidden");
}

/* STOK */
function stokEkle(){
  if(!barkod.value||!urun.value) return;
  stok.push({barkod:barkod.value,urun:urun.value,adet:0});
  localStorage.setItem("stok",JSON.stringify(stok));
  renderStok();
}

function renderStok(){
  stokList.innerHTML="";
  stok.forEach((s,i)=>{
    stokList.innerHTML+=`
    <li>${s.barkod}/${s.urun}/${s.adet}</li>`;
  });
}

/* CARİ */
function cariEkle(){
  cari.push(cariInput.value);
  cari.sort();
  localStorage.setItem("cari",JSON.stringify(cari));
  renderCari();
}

function renderCari(){
  cariList.innerHTML="";
  cari.forEach(c=>{
    cariList.innerHTML+=`<li>${c}</li>`;
  });
}

/* CAMERA */
function kamera(){
  stopCam();

  scanner=new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(dev=>{
    scanner.start(
      dev[0].id,
      {fps:10,qrbox:250},
      (text)=>{
        barkod.value=text;
        stopCam();
      }
    );
  });
}

/* STOP CAMERA */
function stopCam(){
  if(scanner){
    scanner.stop().then(()=>scanner.clear()).catch(()=>{});
    scanner=null;
  }
}

</script>

</body>
</html>
