<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARKODPACKER ERP</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f1f5f9;
}

.hidden{
    display:none;
}

.navbar{
    background:#2563eb;
    color:white;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
}

.box{
    padding:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    margin-top:8px;
    font-size:16px;
    font-weight:bold;
    color:white;
    background:#2563eb;
}

.btn-red{
    background:#ef4444;
}

.btn-green{
    background:#22c55e;
}

.btn-orange{
    background:#f59e0b;
}

.btn-gray{
    background:#64748b;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
    margin-top:8px;
    box-sizing:border-box;
}

.card{
    background:white;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.smallBtn{
    width:auto;
    padding:8px 10px;
    border-radius:8px;
    margin-left:5px;
}

.gridMenu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

#reader,#readerStok{
    width:100%;
    margin-top:10px;
}

table{
    width:100%;
    background:white;
    border-radius:10px;
    margin-top:10px;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

</style>
</head>

<body>

<div class="navbar hidden" id="navbar">
    <span>BARKODPACKER ERP</span>
    <button style="width:auto;padding:5px 15px;" onclick="goHome()">🏠</button>
</div>

<!-- LOGIN -->

<div id="loginPage" class="box">

    <h2>Giriş</h2>

    <input id="userInp" placeholder="Kullanıcı">

    <input id="passInp" type="password" placeholder="Şifre">

    <select id="firmaInp">
        <option value="">Firma Seç</option>
        <option>Demo</option>
        <option>Test LTD</option>
    </select>

    <button onclick="login()">GİRİŞ</button>

</div>

<!-- HOME -->

<div id="homePage" class="box hidden">

    <div class="gridMenu">

        <button onclick="openPage('stokPage')">
            STOK DETAY
        </button>

        <button onclick="openPage('sayimPage')">
            SAYIM FİŞİ
        </button>

        <button onclick="yeniAlisBaslat()">
            ALIŞ İRSALİYESİ
        </button>

        <button onclick="showToast('Hazırlanıyor')">
            SATIŞ İRSALİYESİ
        </button>

        <button onclick="openPage('cariPage')">
            CARİ
        </button>

    </div>

    <button class="btn-red" onclick="logout()">
        ÇIKIŞ
    </button>

</div>

<!-- STOK -->

<div id="stokPage" class="box hidden">

    <h3>STOK DETAY</h3>

    <button class="btn-green" onclick="openPage('stokEklePage')">
        YENİ STOK EKLE
    </button>

    <input id="stokAra" placeholder="Ara..." oninput="stokListele()">

    <div id="stokListesi"></div>

</div>

<!-- STOK EKLE -->

<div id="stokEklePage" class="box hidden">

    <h3>STOK EKLE</h3>

    <div style="display:flex;gap:5px;">

        <input id="newBarkodInp" placeholder="Barkod">

        <button style="width:70px;" onclick="kameraAcStok()">
            📷
        </button>

    </div>

    <div id="readerStok"></div>

    <input id="newAdInp" placeholder="Ürün Adı">

    <button class="btn-green" onclick="stokKaydet()">
        KAYDET
    </button>

</div>

<!-- CARİ -->

<div id="cariPage" class="box hidden">

    <h3>CARİLER</h3>

    <input id="cariName" placeholder="Cari Adı">

    <button class="btn-green" onclick="cariEkle()">
        EKLE
    </button>

    <div id="cariListesi"></div>

</div>

<!-- ALIŞ -->

<div id="alisPage" class="box hidden">

    <div class="card">

        <div>
            <b>No:</b>
            <span id="dispEvrakNo">-</span>
            <br>
            <b>Cari:</b>
            <span id="dispCari">Seçilmedi</span>
        </div>

    </div>

    <button onclick="openPage('belgePage')">
        BELGE NO
    </button>

    <button onclick="openCariSec()">
        CARİ SEÇ
    </button>

    <button onclick="barkodGirisAc()">
        BARKOD GİRİŞ
    </button>

    <button onclick="islemSatirlari()">
        İŞLEM SATIRLARI
    </button>

    <button class="btn-orange" onclick="openEvrakGetir()">
        EVRAK GETİR
    </button>

</div>

<!-- BELGE -->

<div id="belgePage" class="box hidden">

    <input id="belgeDinamik" placeholder="Belge No">

    <button class="btn-green" onclick="belgeKaydet()">
        KAYDET
    </button>

</div>

<!-- CARİ SEÇ -->

<div id="cariSecPage" class="box hidden">

    <div id="cariSecListesi"></div>

</div>

<!-- BARKOD -->

<div id="barkodPage" class="box hidden">

    <div style="display:flex;gap:5px;">

        <input id="barcodeInp" placeholder="Barkod">

        <button style="width:70px;" onclick="urunBul()">
            OK
        </button>

        <button style="width:70px;" onclick="kameraAc()">
            📷
        </button>

    </div>

    <div id="reader"></div>

    <div id="urunDetay" class="hidden">

        <div class="card" id="urunText"></div>

        <input id="adetInp" type="number" placeholder="Adet">

        <button class="btn-green" onclick="evragaEkle()">
            EKLE
        </button>

    </div>

</div>

<!-- İŞLEM -->

<div id="islemPage" class="box hidden">

    <table>

        <thead>

        <tr>

            <th>Barkod</th>
            <th>Ürün</th>
            <th>Adet</th>

        </tr>

        </thead>

        <tbody id="islemBody"></tbody>

    </table>

</div>

<!-- EVRAK -->

<div id="evrakListesiPage" class="box hidden">

    <h3>EVRAK GETİR</h3>

    <label>İlk Tarih</label>
    <input type="date" id="filterBasTar">

    <label>Son Tarih</label>
    <input type="date" id="filterBitTar">

    <button class="btn-green" onclick="evrakSorgula()">
        EVRAKLARI GETİR
    </button>

    <table>

        <thead>

        <tr>

            <th>Tarih</th>
            <th>No</th>
            <th>Cari</th>

        </tr>

        </thead>

        <tbody id="evrakBody"></tbody>

    </table>

</div>

<!-- SAYIM -->

<div id="sayimPage" class="box hidden">

    <h3>SAYIM FİŞİ</h3>

    <button onclick="showToast('Hazırlanıyor')">
        SAYIM BAŞLAT
    </button>

</div>

<script>

let db_stok = JSON.parse(localStorage.getItem("db_stok") || "[]");

let db_cari = JSON.parse(localStorage.getItem("db_cari") || "[]");

let db_evraklar = JSON.parse(localStorage.getItem("db_evraklar") || "[]");

let aktifEvrak = {
    no:"",
    cari:"",
    tarih:"",
    kalemler:[]
};

let html5QrCode = null;

function showToast(msg){
    alert(msg);
}

function login(){

    if(
        document.getElementById("userInp").value=="admin"
        &&
        document.getElementById("passInp").value=="1234"
        &&
        document.getElementById("firmaInp").value!=""
    ){

        document.getElementById("loginPage").classList.add("hidden");

        document.getElementById("navbar").classList.remove("hidden");

        goHome();

    }else{
        alert("Hatalı");
    }
}

function logout(){
    location.reload();
}

function openPage(id){

    document.querySelectorAll(".box").forEach(x=>{
        x.classList.add("hidden");
    });

    document.getElementById(id).classList.remove("hidden");

    stopCamera();

    if(id=="stokPage"){
        stokListele();
    }

    if(id=="cariPage"){
        cariListele();
    }
}

function goHome(){
    openPage("homePage");
}

function stokKaydet(){

    let barkod =
    document.getElementById("newBarkodInp").value;

    let ad =
    document.getElementById("newAdInp").value;

    if(!barkod || !ad){
        return;
    }

    db_stok.push({
        barkod:barkod,
        ad:ad,
        stok:0
    });

    localStorage.setItem(
        "db_stok",
        JSON.stringify(db_stok)
    );

    openPage("stokPage");
}

function stokListele(){

    let html="";

    db_stok.forEach((s,i)=>{

        html += `
        <div class="card">

            <div>

                <b>${s.ad}</b>

                <br>

                ${s.barkod}

                <br>

                Stok: ${s.stok}

            </div>

            <div>

                <button class="smallBtn btn-orange">
                    ✏️
                </button>

                <button class="smallBtn btn-red"
                onclick="stokSil(${i})">

                    ❌

                </button>

            </div>

        </div>
        `;
    });

    document.getElementById(
        "stokListesi"
    ).innerHTML = html;
}

function stokSil(i){

    if(confirm("Silinsin mi?")){

        db_stok.splice(i,1);

        localStorage.setItem(
            "db_stok",
            JSON.stringify(db_stok)
        );

        stokListele();
    }
}

function cariEkle(){

    let c =
    document.getElementById("cariName").value;

    if(!c)return;

    db_cari.push(c);

    localStorage.setItem(
        "db_cari",
        JSON.stringify(db_cari)
    );

    cariListele();
}

function cariListele(){

    let html="";

    db_cari.forEach((c,i)=>{

        html += `
        <div class="card">

            <div>${c}</div>

            <div>

                <button class="smallBtn btn-orange">
                    ✏️
                </button>

                <button class="smallBtn btn-red"
                onclick="cariSil(${i})">

                    ❌

                </button>

            </div>

        </div>
        `;
    });

    document.getElementById(
        "cariListesi"
    ).innerHTML = html;
}

function cariSil(i){

    if(confirm("Silinsin mi?")){

        db_cari.splice(i,1);

        localStorage.setItem(
            "db_cari",
            JSON.stringify(db_cari)
        );

        cariListele();
    }
}

function yeniAlisBaslat(){

    let no = Math.floor(
        Math.random()*999999
    );

    aktifEvrak = {
        no:no,
        cari:"",
        tarih:new Date()
        .toISOString()
        .split('T')[0],
        kalemler:[]
    };

    document.getElementById(
        "dispEvrakNo"
    ).innerText = no;

    document.getElementById(
        "dispCari"
    ).innerText = "Seçilmedi";

    openPage("alisPage");
}

function belgeKaydet(){

    aktifEvrak.no =
    document.getElementById(
        "belgeDinamik"
    ).value;

    document.getElementById(
        "dispEvrakNo"
    ).innerText = aktifEvrak.no;

    openPage("alisPage");
}

function openCariSec(){

    let html="";

    db_cari.forEach(c=>{

        html += `
        <div class="card"
        onclick="cariSec('${c}')">

            ${c}

        </div>
        `;
    });

    document.getElementById(
        "cariSecListesi"
    ).innerHTML = html;

    openPage("cariSecPage");
}

function cariSec(c){

    aktifEvrak.cari = c;

    document.getElementById(
        "dispCari"
    ).innerText = c;

    openPage("alisPage");
}

function barkodGirisAc(){

    if(!aktifEvrak.cari){
        return alert("Cari seç");
    }

    openPage("barkodPage");
}

function urunBul(){

    let b =
    document.getElementById(
        "barcodeInp"
    ).value;

    let u =
    db_stok.find(x=>x.barkod==b);

    if(!u){
        return alert("Ürün yok");
    }

    document.getElementById(
        "urunText"
    ).innerHTML = `
    <b>${u.ad}</b>
    <br>
    Stok:${u.stok}
    `;

    document.getElementById(
        "urunDetay"
    ).classList.remove("hidden");
}

function evragaEkle(){

    let miktar =
    parseInt(
        document.getElementById(
            "adetInp"
        ).value
    );

    let barkod =
    document.getElementById(
        "barcodeInp"
    ).value;

    let u =
    db_stok.find(x=>x.barkod==barkod);

    if(!u)return;

    aktifEvrak.kalemler.push({

        barkod:barkod,
        ad:u.ad,
        miktar:miktar

    });

    u.stok += miktar;

    localStorage.setItem(
        "db_stok",
        JSON.stringify(db_stok)
    );

    let idx =
    db_evraklar.findIndex(
        x=>x.no==aktifEvrak.no
    );

    if(idx>-1){

        db_evraklar[idx] =
        aktifEvrak;

    }else{

        db_evraklar.push(
            aktifEvrak
        );
    }

    localStorage.setItem(
        "db_evraklar",
        JSON.stringify(db_evraklar)
    );

    alert("Eklendi");
}

function islemSatirlari(){

    let html="";

    aktifEvrak.kalemler.forEach(k=>{

        html += `
        <tr>

            <td>${k.barkod}</td>

            <td>${k.ad}</td>

            <td>${k.miktar}</td>

        </tr>
        `;
    });

    document.getElementById(
        "islemBody"
    ).innerHTML = html;

    openPage("islemPage");
}

function openEvrakGetir(){

    let bugun = new Date()
    .toISOString()
    .split('T')[0];

    document.getElementById(
        "filterBasTar"
    ).value = bugun;

    document.getElementById(
        "filterBitTar"
    ).value = bugun;

    openPage("evrakListesiPage");
}

function evrakSorgula(){

    let bas =
    document.getElementById(
        "filterBasTar"
    ).value;

    let bit =
    document.getElementById(
        "filterBitTar"
    ).value;

    let filtre =
    db_evraklar.filter(e=>
        e.tarih>=bas &&
        e.tarih<=bit
    );

    let html="";

    filtre.forEach(e=>{

        html += `
        <tr>

            <td>${e.tarih}</td>

            <td>${e.no}</td>

            <td>${e.cari}</td>

        </tr>
        `;
    });

    if(html==""){

        html=`
        <tr>
        <td colspan="3">
        Evrak Yok
        </td>
        </tr>
        `;
    }

    document.getElementById(
        "evrakBody"
    ).innerHTML = html;
}

function kameraAc(){

    stopCamera();

    html5QrCode =
    new Html5Qrcode("reader");

    html5QrCode.start(

        {
            facingMode:"environment"
        },

        {
            fps:10,
            qrbox:250
        },

        text=>{

            document.getElementById(
                "barcodeInp"
            ).value = text;

            stopCamera();

            urunBul();
        }
    );
}

function kameraAcStok(){

    stopCamera();

    html5QrCode =
    new Html5Qrcode("readerStok");

    html5QrCode.start(

        {
            facingMode:"environment"
        },

        {
            fps:10,
            qrbox:250
        },

        text=>{

            document.getElementById(
                "newBarkodInp"
            ).value = text;

            stopCamera();
        }
    );
}

function stopCamera(){

    if(
        html5QrCode &&
        html5QrCode.isScanning
    ){

        html5QrCode.stop()
        .then(()=>{

            html5QrCode.clear();

        });
    }
}

</script>

</body>
</html>
