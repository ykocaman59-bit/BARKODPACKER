name: HTML to APK Builder

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Kodlarını İndir
      uses: actions/checkout@v4

    - name: Node.js Ortamını Kur
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Cordova ve Paketleme Araçlarını Yükle
      run: |
        npm install -g cordova

    - name: Geçici Cordova Projesi Oluştur ve Özelleştir
      run: |
        cordova create myApp com.barkodpacker.app BarkodPacker
        cd myApp
        cordova platform add android
        
        # HTML dosyalarını kopyala
        rm -rf www/*
        cp -r ../index.html www/
        
        # Eğer repo'da icon.svg varsa simge olarak ayarla
        if [ -f "../icon.svg" ]; then
          mkdir -p res/icon/android
          cp ../icon.svg res/icon/android/icon.svg
        fi

        cordova build android --debug

    - name: Üretilen APK Dosyasını Yeniden Adlandır ve Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: BarkodPacker
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
