name: HTML to APK Builder

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Kodlarını İndir
      uses: actions/checkout@v4

    - name: Node.js Ortamını Kur
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Görsel Dönüştürücü ve Cordova Araçlarını Yükle
      run: |
        sudo apt-get update
        sudo apt-get install -y librsvg2-bin
        npm install -g cordova

    - name: Projeyi Oluştur ve Yapılandır
      run: |
        cordova create myApp com.barkodpacker.app BarkodPacker
        cd myApp
        cordova platform add android
        
        # HTML dosyalarını kopyala
        rm -rf www/*
        cp -r ../index.html www/

        # SVG ikonunu uygulama ikonu için PNG'ye dönüştür
        mkdir -p res/icon/android
        rsvg-convert -w 512 -h 512 ../icon.svg -o res/icon/android/icon.png

        # config.xml içine uygulama adını, ikonunu ve açılış ekranını KAPATAN ayarları yaz
        cat << 'EOF' > config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.barkodpacker.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">
            <name>BarkodPacker</name>
            <description>Barkod ve Stok Yönetim Sistemi</description>
            <author email="dev@barkodpacker.app" href="https://github.com">BarkodPacker Team</author>
            <content src="index.html" />
            <access origin="*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            
            <!-- Açılış ekranını tamamen devre dışı bırak -->
            <preference name="SplashScreen" value="none" />
            <preference name="SplashScreenDelay" value="0" />

            <platform name="android">
                <allow-intent href="market:*" />
                <icon src="res/icon/android/icon.png" />
            </platform>
        </widget>
        EOF

        cordova build android --debug

        # APK dosyasını doğrudan BarkodPacker.apk olarak adlandır
        cp platforms/android/app/build/outputs/apk/debug/app-debug.apk platforms/android/app/build/outputs/apk/debug/BarkodPacker.apk

    - name: APK Dosyasını Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: BarkodPacker
        path: myApp/platforms/android/app/build/outputs/apk/debug/BarkodPacker.apk
        if-no-files-found: error
        retention-days: 1
        
