name: HTML to APK Builder

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Kodlarını İndir
      uses: actions/checkout@v4

    - name: Node.js Ortamını Kur
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Cordova ve Paketleme Araçlarını Yükle
      run: |
        npm install -g cordova

    - name: Geçici Cordova Projesi Oluştur ve HTML'leri Ekle
      run: |
        cordova create myApp com.barkodpacker.app BarkodPacker
        cd myApp
        cordova platform add android
        
        # Ana repodaki index.html ve diğer dosyaları cordova www klasörüne kopyala
        rm -rf www/*
        cp -r ../index.html www/
        # Eğer varsa css, js klasörlerini de kopyalayabilirsin, örn:
        # cp -r ../css www/ 2>/dev/null || true
        # cp -r ../js www/ 2>/dev/null || true

        cordova build android --debug

    - name: Üretilen APK Dosyasını Kaydet (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: html-debug-apk
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
