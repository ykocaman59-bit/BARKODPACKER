name: Pure Android WebView APK Builder

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Kodlarını İndir
      uses: actions/checkout@v4

    - name: Java (JDK) Ortamını Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle Kurulumu (7.5)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5'

    - name: Saf Android Gradle Projesini Oluştur ve Derle
      run: |
        # Dizin yapısını oluştur
        mkdir -p app/src/main/java/com/barkodpacker/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/assets

        # HTML dosyasını assets klasörüne kopyala
        cp index.html app/src/main/assets/index.html

        # AndroidManifest.xml (Önce Splash Activity, sonra Main Activity açılacak şekilde)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="BarkodPacker"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                
                <!-- Giriş (Splash) Ekranı Aktivitesi -->
                <activity
                    android:name=".SplashActivity"
                    android:exported="true"
                    android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <!-- Ana WebView Aktivitesi -->
                <activity
                    android:name=".MainActivity"
                    android:exported="false"
                    android:configChanges="orientation|screenSize|keyboardHidden" />

            </application>
        </manifest>
        EOF

        # SplashActivity.java (Logonun animasyonla belirip ana sayfaya geçtiği ekran)
        cat << 'EOF' > app/src/main/java/com/barkodpacker/app/SplashActivity.java
        package com.barkodpacker.app;

        import android.content.Intent;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.Looper;
        import android.view.animation.AlphaAnimation;
        import android.view.animation.Animation;
        import android.widget.ImageView;
        import android.widget.LinearLayout;
        import android.graphics.Color;
        import androidx.appcompat.app.AppCompatActivity;

        public class SplashActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                // Arka planı şık koyu/açık bir tona ayarlayabilirsin (Burada beyaz yaptık, ikonunarkasına göre değişebilir)
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setGravity(android.view.Gravity.CENTER);
                layout.setBackgroundColor(Color.parseColor("#FFFFFF"));

                ImageView logoView = new ImageView(this);
                // Projedeki uygulama ikonunu giriş ekranında logo olarak kullanıyoruz
                logoView.setImageResource(R.mipmap.ic_launcher);
                
                LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(300, 300);
                logoView.setLayoutParams(params);
                layout.addView(logoView);
                setContentView(layout);

                // Logonun belirmesi için yumuşak bir Fade-In (giriş) animasyonu
                Animation fadeIn = new AlphaAnimation(0.0f, 1.0f);
                fadeIn.setDuration(1000);
                logoView.startAnimation(fadeIn);

                // 2 saniye (2000 milisaniye) bekledikten sonra MainActivity'e (WebView) geçiş yap
                new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                    @Override
                    public void run() {
                        Intent intent = new Intent(SplashActivity.this, MainActivity.class);
                        startActivity(intent);
                        finish();
                    }
                }, 2000);
            }
        }
        EOF

        # MainActivity.java (Ana WebView Ekranı)
        cat << 'EOF' > app/src/main/java/com/barkodpacker/app/MainActivity.java
        package com.barkodpacker.app;

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setDatabaseEnabled(true);
                
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                
                setContentView(webView);
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # Kök build.gradle (Stabil AGP 7.4.2)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

        # settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "BarkodPacker"
        include ':app'
        EOF

        # app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.barkodpacker.app'
            compileSdk 33

            defaultConfig {
                applicationId "com.barkodpacker.app"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        # Logoyu PNG formatına dönüştürüp ikon olarak ekle
        sudo apt-get update && sudo apt-get install -y librsvg2-bin
        rsvg-convert -w 192 -h 192 icon.svg -o app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png

        # Projeyi derle
        gradle assembleDebug --no-daemon

        # APK dosyasını doğrudan BarkodPacker.apk olarak kopyala
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BarkodPacker.apk

    - name: APK Dosyasını Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: BarkodPacker
        path: app/build/outputs/apk/debug/BarkodPacker.apk
        if-no-files-found: error
        retention-days: 1
        
